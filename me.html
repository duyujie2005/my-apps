<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的账号 · 杜裕杰的软件柜</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f7fb; color: #1f2430; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #7b8494; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e6eaf1; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px #0000000a; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: #4a5568; font-weight: 600; }
  .avas { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
  .ava { font-size: 24px; line-height: 1; padding: 8px 0; text-align: center; background: #f2f5fa; border: 2px solid transparent; border-radius: 10px; cursor: pointer; }
  .ava:hover { background: #e9effb; }
  .ava.on { border-color: #2b7cff; background: #eaf2ff; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input[type="text"] { flex: 1; font-size: 15px; padding: 10px 12px; border: 1px solid #dfe4ec; border-radius: 10px; background: #fbfcfe; }
  button.main { font-size: 15px; padding: 10px 18px; border: 0; border-radius: 10px; background: #2b7cff; color: #fff; cursor: pointer; }
  button.main:disabled { opacity: .6; }
  .hint { font-size: 12px; color: #8a929e; margin-top: 8px; }
  .code { font-size: 26px; letter-spacing: 3px; font-weight: 600; color: #1f2430; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { font-size: 13px; padding: 8px 12px; background: #fff; border: 1px solid #e6eaf1; border-radius: 10px; color: #2b7cff; text-decoration: none; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1f2430; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>我的账号</h1>
  <div class="sub">头像和名字改了之后，好友和全站榜单上都会显示新的样子。</div>

  <div class="card">
    <h2>选个头像</h2>
    <div class="avas" id="avas"></div>
  </div>

  <div class="card">
    <h2>用照片当头像</h2>
    <div class="row" style="align-items:center;gap:12px;margin-top:0">
      <div id="phPrev" style="width:56px;height:56px;border-radius:50%;background:#eaf2ff;border:1px solid #dfe4ec;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden"></div>
      <div style="flex:1">
        <button class="main" id="pick" type="button">选一张照片</button>
        <div class="hint">会自动裁成圆形、压到很小再保存，手机电脑都清楚；不想用照片就上面挑表情。</div>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>

  <div class="card">
    <h2>我的名字</h2>
    <div class="row">
      <input type="text" id="nick" maxlength="12" placeholder="起个名字，最多 12 个字">
      <button class="main" id="save">保存</button>
    </div>
    <div class="hint">名字会显示在打地鼠、反射弧的全站榜单上。</div>
  </div>

  <div class="card">
    <h2>我的好友码</h2>
    <div class="row" style="align-items:center">
      <div class="code" id="code">------</div>
      <button class="main" id="copy" style="padding:8px 14px">复制</button>
    </div>
    <div class="hint">把这一串数字发给朋友，对方在「好友」页输入就能加到你。</div>
  </div>

  <div class="card">
    <h2>去哪儿</h2>
    <div class="links">
      <a href="index.html">软件柜首页</a>
      <a href="friends.html">好友 / 聊天 / PK</a>
      <a href="world.html">大世界</a>
      <a href="whack.html">打地鼠</a>
      <a href="reflex.html">反射弧</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="auth.js" data-guard="1"></script>
<script>
(function () {
  var AVATARS = ["🙂","😎","🐱","🐶","🦊","🐼","🐯","🦁","🐸","🐵","🐷","🐰","🦄","🐙","🐳","🦉","🌟","🍀","🔥","⚡","🎮","🎯","⚽","🍎"];
  var chosen = "🙂";
  var box = document.getElementById("avas");
  var toastEl = document.getElementById("toast");

  function toast(t) {
    toastEl.textContent = t;
    toastEl.classList.add("on");
    setTimeout(function () { toastEl.classList.remove("on"); }, 1600);
  }

  function paint() {
    box.innerHTML = "";
    AVATARS.forEach(function (e) {
      var b = document.createElement("div");
      b.className = "ava" + (e === chosen ? " on" : "");
      b.textContent = e;
      b.onclick = function () { chosen = e; paint(); };
      box.appendChild(b);
    });
    var pp = document.getElementById("phPrev");
    pp.innerHTML = window.AV ? window.AV(chosen, 52) : chosen;
    pp.style.background = (typeof chosen === "string" && chosen.indexOf("data:image") === 0) ? "#fff" : "#eaf2ff";
  }

  // 选照片：裁成正方形 → 缩到 96×96 → 压成很小的 JPEG
  function handleFile(file) {
    if (!file) { return; }
    if (!/^image\//.test(file.type)) { toast("请选图片文件（jpg / png 都行）"); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2;
        var sy = (img.height - side) / 2;
        var cv = document.createElement("canvas");
        cv.width = 96; cv.height = 96;
        var cx = cv.getContext("2d");
        cx.drawImage(img, sx, sy, side, side, 0, 0, 96, 96);
        var out = cv.toDataURL("image/jpeg", 0.75);
        if (out.length > 60000) {
          cv.width = 80; cv.height = 80;
          cx.drawImage(img, sx, sy, side, side, 0, 0, 80, 80);
          out = cv.toDataURL("image/jpeg", 0.6);
        }
        chosen = out;
        paint();
        toast("照片已选好，点「保存」就生效");
      } catch (e) {
        toast("这张图读不出来，换一张试试");
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { toast("这张图打不开，换一张试试"); URL.revokeObjectURL(url); };
    img.src = url;
  }

  paint();

  function boot() {
    if (!window.SYNC) {
      toast("没连上云端，先刷新一下页面");
      return;
    }
    SYNC.profile(true).then(function (p) {
      if (!p) { return; }
      chosen = p.avatar || "🙂";
      if (chosen.indexOf("data:image") !== 0 && AVATARS.indexOf(chosen) < 0) { AVATARS.unshift(chosen); }
      paint();
      document.getElementById("nick").value = p.nick || "";
      document.getElementById("code").textContent = p.code || "先去「好友」页逛一下";
    }).catch(function () {});
  }

  var btn = document.getElementById("save");
  var fileEl = document.getElementById("file");
  document.getElementById("pick").onclick = function () { fileEl.value = ""; fileEl.click(); };
  fileEl.onchange = function () { handleFile(fileEl.files && fileEl.files[0]); };
  btn.onclick = function () {
    var nick = document.getElementById("nick").value.trim().slice(0, 12);
    if (!nick) { toast("名字不能是空的"); return; }
    btn.disabled = true;
    btn.textContent = "保存中…";
    SYNC.saveProfile(nick, chosen).then(function (p) {
      btn.disabled = false;
      btn.textContent = "保存";
      document.getElementById("code").textContent = (p && p.code) || "------";
      toast("已保存 ✓ 换设备登录也会是这个样子");
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = "保存";
      toast("保存失败：" + ((e && e.message) || "网络问题"));
    });
  };

  document.getElementById("copy").onclick = function () {
    var t = document.getElementById("code").textContent;
    if (!t || t.indexOf("-") >= 0) { toast("还没有好友码，先去「好友」页逛一下"); return; }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(t).then(function () { toast("已复制好友码"); }).catch(function () { toast(t); });
    } else { toast(t); }
  };

  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }

  if (window.SYNC) { boot(); } else { document.addEventListener("DOMContentLoaded", boot); }
})();
</script>
</body>
</html>
