14:17 2026/11/23<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>傻逼打怪</title>
<style>
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    padding: 28x;
    color: #222;
  }
  h1 { font-size: 22px; margin-bottom: 16px; }

  /* ===== 战斗场景 ===== */
  .stage {
    display: flex;
    align-items: center;
    justify-content: space-around;
    position: relative;
    overflow: hidden;
    padding: 22px 10px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    background: linear-gradient(#a9d6ff, #e8f4ff 58%, #cfe8a9 58%, #b3d98c);
  }
  .fighter {
    width: 40%;
    text-align: center;
    position: relative;
  }
  .fighter.hit { animation: shake 0.28s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-9px); }
    75% { transform: translateX(9px); }
  }

  .emoji {
    font-size: 66px;
    line-height: 1.15;
    user-select: none;
    display: inline-block;
    filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.18));
  }
  .emoji.dead { opacity: 0; transform: scale(0.5); transition: all 0.5s; }
  .emoji.hurt { filter: drop-shadow(0 0 10px #ff4d4d) brightness(1.6); }

  .vs { font-size: 20px; font-weight: 700; color: #6b7785; }

  .hname { font-size: 14px; color: #35404d; margin: 4px 0 6px; }

  /* ===== 血条 ===== */
  .barbox {
    height: 12px;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 6px;
    overflow: hidden;
    margin: 0 6px;
  }
  .bar {
    height: 100%;
    width: 100%;
    background: #2bb673;
    transition: width 0.25s;
  }
  .bar.red { background: #e35d5d; }

  /* ===== 飘字 ===== */
  .fnum {
    position: absolute;
    left: 50%;
    top: 30px;
    font-size: 22px;
    font-weight: 700;
    pointer-events: none;
    animation: floatUp 0.9s forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -52px); }
  }

  /* ===== 数据条与按钮 ===== */
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 12px;
    font-size: 15px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
  button {
    font-size: 15px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #2b7cff;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #1a66e0; }
  .ghost { background: #e9ecf1; color: #444; }
  .ghost:hover { background: #dde1e8; }

  ul { list-style: none; padding: 0; margin: 0; font-size: 14px; color: #555; }
  li { background: #fff; border-radius: 8px; padding: 9px 14px; margin-bottom: 6px; }
</style>
</head>
<body>

  <h1>勇者打怪</h1>

  <!-- ===== 画面：左边我，右边怪 ===== -->
  <div class="stage">
    <div class="fighter" id="heroFig">
      <div class="emoji" id="heroEmoji">🧙</div>
      <div class="hname">勇者 · Lv <span id="heroLv">1</span></div>
      <div class="barbox"><div id="heroHpBar" class="bar"></div></div>
      <div class="hname"><span id="heroHp">20</span> / <span id="heroMaxHp">20</span></div>
    </div>

    <div class="vs">VS</div>

    <div class="fighter" id="monFig">
      <div class="emoji" id="monEmoji">❔</div>
      <div class="hname"><span id="monName">准备中…</span></div>
      <div class="barbox"><div id="monHpBar" class="bar red"></div></div>
      <div class="hname"><span id="monHp">0</span> / <span id="monMaxHp">0</span></div>
    </div>
  </div>

  <div class="card">
    经验 <span id="heroExp">0</span> / <span id="heroNeed">10</span>
    ｜ 💰 <span id="heroGold">0</span>
    ｜ ⚔ 攻击 <span id="heroAtk">5</span>
  </div>

  <div class="row">
    <button onclick="attack()">攻击</button>
    <button class="ghost" onclick="heal()">休整（回满血，3 金币）</button>
    <button class="ghost" onclick="newMonster()">换个对手</button>
    <button class="ghost" onclick="restart()">重新开始</button>
  </div>

  <ul id="log"></ul>

  <script>
    // ============ 一、数据 ============
    let hero = { lv: 1, exp: 0, need: 10, hp: 20, maxHp: 20, atk: 5, gold: 0 };
    let monster = null;

    // 每种怪有一张"脸"：emoji
    const MONSTER_TYPES = [
      { name: "野兔",     emoji: "🐰" },
      { name: "史莱姆",   emoji: "🫧" },
      { name: "骷髅兵",   emoji: "💀" },
      { name: "野狼",     emoji: "🐺" },
      { name: "石魔像",   emoji: "🗿" },
      { name: "暗影法师", emoji: "👻" },
      { name: "巨魔",     emoji: "👹" }
    ];

    // ============ 二、存档 ============
    function save() { localStorage.setItem("heroSave", JSON.stringify(hero)); }
    function load() {
      const text = localStorage.getItem("heroSave");
      if (text) { hero = JSON.parse(text); }
    }

    // ============ 三、日志 ============
    function log(text) {
      const ul = document.getElementById("log");
      const li = document.createElement("li");
      li.textContent = text;
      ul.insertBefore(li, ul.firstChild);
      while (ul.children.length > 8) { ul.removeChild(ul.lastChild); }
    }

    // ============ 四、画面特效 ============
    // 谁挨打：那个框抖一下 + 飘出一个伤害数字
    function hitFx(figId, text, color) {
      const fig = document.getElementById(figId);

      // 先把动画"清零"再重新加上，否则第二次点击不会重播
      fig.classList.remove("hit");
      void fig.offsetWidth;
      fig.classList.add("hit");

      const num = document.createElement("div");
      num.className = "fnum";
      num.style.color = color;
      num.textContent = text;
      fig.appendChild(num);
      setTimeout(function () { num.remove(); }, 900);
    }

    // 勇者的样子会随等级变强
    function heroFace() {
      if (hero.lv >= 10) { return "🦸"; }
      if (hero.lv >= 5) { return "🧝"; }
      return "🧙";
    }

    // ============ 五、生成怪物 ============
    function newMonster() {
      const t = MONSTER_TYPES[Math.floor(Math.random() * MONSTER_TYPES.length)];
      const lv = hero.lv;
      monster = {
        name: t.name,
        emoji: t.emoji,
        lv: lv,
        maxHp: 12 + lv * 6,
        hp: 12 + lv * 6,
        atk: 2 + lv
      };
      log("前方出现一只 " + monster.name + "（Lv " + monster.lv + "，血 " + monster.maxHp + "）");
      render();
    }

    // ============ 六、一个回合 ============
    function attack() {
      if (!monster) { newMonster(); return; }

      // 1. 我打它
      const dmg = hero.atk + Math.floor(Math.random() * 3);
      monster.hp = monster.hp - dmg;
      log("你挥剑，造成 " + dmg + " 点伤害");
      hitFx("monFig", "-" + dmg, "#e35d5d");

      const monEmoji = document.getElementById("monEmoji");
      monEmoji.classList.add("hurt");
      setTimeout(function () { monEmoji.classList.remove("hurt"); }, 350);

      // 2. 它死了吗
      if (monster.hp <= 0) {
        monster.hp = 0;
        render();
        monEmoji.classList.add("dead");          // 倒下动画

        const exp = 4 + monster.lv * 3;
        const gold = 1 + Math.floor(Math.random() * 3);
        hero.exp = hero.exp + exp;
        hero.gold = hero.gold + gold;
        log("击败 " + monster.name + "！获得 " + exp + " 经验、" + gold + " 金币");
        checkLevel();
        save();

        setTimeout(function () {
          monEmoji.classList.remove("dead");
          newMonster();
        }, 550);
        return;
      }

      // 3. 它没死，反击
      const back = monster.atk + Math.floor(Math.random() * 2);
      hero.hp = hero.hp - back;
      log(monster.name + " 反击，你受到 " + back + " 点伤害");
      hitFx("heroFig", "-" + back, "#c0392b");

      if (hero.hp <= 0) { defeat(); return; }

      render();
      save();
    }

    // ============ 七、升级 / 倒下 / 休整 ============
    function checkLevel() {
      let up = false;
      while (hero.exp >= hero.need) {
        hero.exp = hero.exp - hero.need;
        hero.lv = hero.lv + 1;
        hero.need = Math.floor(hero.need * 1.5);
        hero.maxHp = hero.maxHp + 5;
        hero.atk = hero.atk + 2;
        hero.hp = hero.maxHp;
        log("★ 升级！Lv " + hero.lv + "，攻击 " + hero.atk + "，血量上限 " + hero.maxHp);
        up = true;
      }
      if (up) { render(); }
    }

    function defeat() {
      const lost = Math.floor(hero.gold / 2);
      hero.gold = hero.gold - lost;
      hero.hp = hero.maxHp;
      log("你倒下了，被抬回村庄。损失 " + lost + " 金币，血量已恢复");
      monster = null;
      render();
      save();
      setTimeout(newMonster, 600);
    }

    function heal() {
      if (hero.hp === hero.maxHp) { log("血是满的，不用休整"); return; }
      if (hero.gold < 3) { log("金币不够，休整要 3 金币"); return; }
      hero.gold = hero.gold - 3;
      hero.hp = hero.maxHp;
      log("回村休整，血量回满，花了 3 金币");
      render();
      save();
    }

    function restart() {
      if (!confirm("确定重新开始？进度会清空。")) { return; }
      hero = { lv: 1, exp: 0, need: 10, hp: 20, maxHp: 20, atk: 5, gold: 0 };
      monster = null;
      document.getElementById("log").innerHTML = "";
      save();
      render();
      newMonster();
    }

    // ============ 八、重画 ============
    function set(id, value) { document.getElementById(id).textContent = value; }

    function bar(id, ratio) {
      if (ratio < 0) { ratio = 0; }
      if (ratio > 1) { ratio = 1; }
      document.getElementById(id).style.width = (ratio * 100) + "%";
    }

    function render() {
      set("heroLv", hero.lv);
      set("heroExp", hero.exp);
      set("heroNeed", hero.need);
      set("heroGold", hero.gold);
      set("heroAtk", hero.atk);
      set("heroHp", hero.hp);
      set("heroMaxHp", hero.maxHp);
      set("heroEmoji", heroFace());
      bar("heroHpBar", hero.hp / hero.maxHp);

      if (monster) {
        set("monEmoji", monster.emoji);
        set("monName", monster.name + " · Lv " + monster.lv);
        set("monHp", monster.hp);
        set("monMaxHp", monster.maxHp);
        bar("monHpBar", monster.hp / monster.maxHp);
      } else {
        set("monEmoji", "❔");
        set("monName", "准备中…");
        set("monHp", 0);
        set("monMaxHp", 0);
        bar("monHpBar", 0);
      }
    }

    // ============ 九、启动 ============
    load();
    render();
    newMonster();
  </script>

</body>
</html>
