<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>中国象棋 · 杜裕杰的软件柜</title>
<script src="auth.js" data-guard="1"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; overflow: hidden;
    padding-top: 42px;
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: radial-gradient(130% 120% at 50% 0%, #1c2537 0%, #0b0f18 58%, #06090f 100%);
    color: #e9eef7;
  }

  /* 棋盘：宽 = min(视口宽, 剩余高度×8/9)，除顶部细条外铺满整屏 */
  .board {
    position: relative;
    width: min(calc(100vw - 6px), calc((100dvh - 48px) * 8 / 9));
    aspect-ratio: 8 / 9;
    padding: 6% 5.8% 6%;
    background: linear-gradient(160deg, #f3dcaa 0%, #ecd096 45%, #e0bd80 100%);
    border-radius: 10px;
    box-shadow: 0 20px 60px #00000066, inset 0 0 0 1px #ffffff66, inset 0 0 40px #b98b4a33;
  }
  .inner { position: relative; width: 100%; height: 100%; container-type: size; }
  .inner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .river {
    position: absolute; left: 0; right: 0; top: 47%; transform: translateY(-50%);
    display: flex; justify-content: space-between; padding: 0 12%;
    font-size: 3.2vmin; font-size: 3.2cqw;
    color: #7a5230; pointer-events: none; letter-spacing: 8px; opacity: .8;
    font-family: "KaiTi", "STKaiti", serif;
  }
  .piece {
    position: absolute; width: 11.2%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 7vmin; font-size: 7.2cqw; font-weight: 700; cursor: pointer;
    background: radial-gradient(circle at 34% 28%, #fffdf5, #f3e3c1 70%, #dcc59b);
    box-shadow: 0 3px 7px #00000038, inset 0 0 0 2px #ffffffAA, inset 0 0 0 .36em #c9ac79;
    user-select: none; transition: box-shadow .12s, transform .08s;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
  }
  .piece.red { color: #c8281c; }
  .piece.black { color: #23272e; }
  .piece.sel { box-shadow: 0 0 0 3px #2b6df6, 0 4px 12px #00000055; transform: translate(-50%, -50%) scale(1.05); }
  .piece.last { box-shadow: 0 0 0 3px #ffb100AA, 0 4px 12px #00000055; }
  .hint {
    position: absolute; width: 4.6%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: #2b6df6AA; box-shadow: 0 0 0 5px #2b6df633; cursor: pointer;
  }
  .hint.cap { background: #e0492cAA; }
  .lock { position: absolute; inset: 0; background: #00000010; border-radius: 10px; display: none; }

  /* 顶部细条：返回、状态、菜单都放这儿，不压棋盘 */
  .topbar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 30; height: 42px;
    display: flex; align-items: center; gap: 9px; padding: 0 10px;
    background: linear-gradient(#0c1322, #0c1322e6 70%, #0c132200);
  }
  .hbtn {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%; padding: 0;
    background: #ffffff14; border: 1px solid #ffffff24; color: #cfd9ea;
    text-decoration: none; cursor: pointer; font-size: 15px; font-family: inherit;
  }
  .hbtn:active { background: #ffffff2e; }
  .topbar .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #2e9e63; }
  .topbar .dot.off { background: #5b6478; }
  .st {
    flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 600; color: #dfe8f5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .st b { color: #8bbcff; }
  .hbtn.pulse { animation: pulse 1.4s ease-out 3; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 #2b6df688; }
    70% { box-shadow: 0 0 0 10px #2b6df600; }
    100% { box-shadow: 0 0 0 0 #2b6df600; }
  }
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 12px); z-index: 45;
    max-width: 84vw; text-align: center; font-size: 13px; line-height: 1.5;
    background: #0d1522ee; color: #ffd479; border: 1px solid #ffffff1f;
    padding: 9px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .panel {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 35;
    max-width: 560px; margin: 0 auto; padding: 12px 12px 14px;
    background: #0e1421ee; border: 1px solid #26324a; border-radius: 14px;
    box-shadow: 0 18px 50px #00000088; backdrop-filter: blur(10px);
    max-height: 66vh; overflow: auto;
    transform: translateY(calc(100% + 24px)); transition: transform .22s ease;
  }
  .panel.open { transform: translateY(0); }

  .status { font-size: 13.5px; min-height: 18px; margin-bottom: 10px; color: #d7e0ef; }
  .status b { color: #7fb0ff; }

  .modes { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .modes button {
    flex: 1 1 30%; min-width: 30%; padding: 11px 6px; border-radius: 10px; cursor: pointer;
    background: #1a2232; color: #cfd9ea; border: 1px solid #26324a; font-size: 13px;
    font-family: inherit;
  }
  .modes button.on { background: #2b6df6; color: #fff; border-color: #2b6df6; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btns button, .room button, .lv {
    padding: 10px 13px; border-radius: 9px; cursor: pointer; font-size: 13px; font-family: inherit;
    background: #1a2232; color: #cfd9ea; border: 1px solid #26324a;
  }
  .btns button.pri, .room button.pri, .lv.pri { background: #2b6df6; border-color: #2b6df6; color: #fff; }

  .room { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .room input {
    width: 132px; padding: 10px; border-radius: 9px; border: 1px solid #26324a;
    background: #131a28; color: #e9eef7; font-size: 15px; letter-spacing: 3px; font-family: inherit;
  }
  .room .code { font-size: 19px; letter-spacing: 5px; color: #ffd479; font-weight: 700; }
  .tip { font-size: 12px; color: #8a93a5; line-height: 1.7; }

  .moves {
    max-height: 26vh; overflow: auto; background: #131a28; border: 1px solid #1e2740;
    border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.9;
    color: #aab6c9; margin-top: 10px;
  }
  .moves .r { color: #ff9086; }
  .moves .b { color: #9fc6ff; }
  .moves span.no { color: #59637a; margin-right: 4px; }

  @media (max-height: 520px) {
    .panel { max-height: 74vh; }
    .piece { font-size: 6.6vmin; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="hbtn" href="index.html" title="返回软件柜">‹</a>
  <span class="dot" id="dot"></span>
  <div class="st" id="status">准备开局</div>
  <button class="hbtn" id="menuBtn" title="模式 / 菜单">☰</button>
</div>

<div class="board" id="board">
  <div class="inner" id="inner">
    <svg id="grid" viewBox="0 0 8 9" preserveAspectRatio="none"></svg>
    <div class="river"><span>楚 河</span><span>汉 界</span></div>
  </div>
  <div class="lock" id="lock"></div>
</div>

<div class="toast" id="toast"></div>

<div class="panel" id="panel">
  <div class="tip" id="hintText" style="margin-bottom:9px"></div>
  <div class="modes">
    <button data-mode="self">自己和自己打</button>
    <button data-mode="online">玩家 vs 玩家</button>
    <button data-mode="ai">我和人机打</button>
  </div>
  <div id="aiOpts" style="display:none">
    <div class="room" style="flex-wrap:wrap;gap:6px">
      <span class="tip">难度</span>
      <button class="lv" data-lv="1">入门</button>
      <button class="lv" data-lv="2">简单</button>
      <button class="lv" data-lv="3">普通</button>
      <button class="lv" data-lv="4">困难</button>
      <button class="lv" data-lv="5">大师</button>
      <button class="lv" data-lv="6">超强</button>
    </div>
  </div>
  <div id="onlineOpts" style="display:none">
    <div class="room">
      <input id="roomInput" placeholder="房间号" maxlength="6" inputmode="numeric">
      <button id="joinBtn">加入房间</button>
      <button id="newBtn" class="pri">建房间</button>
    </div>
    <div class="room" id="roomInfo" style="display:none">
      <span class="tip">房间号</span><span class="code" id="roomCode"></span>
      <button id="copyBtn">复制</button>
      <button id="leaveBtn">退出房间</button>
    </div>
  </div>
  <div class="btns">
    <button id="undoBtn">悔一步</button>
    <button id="restartBtn" class="pri">重新开局</button>
    <button id="resignBtn" style="display:none">认输</button>
  </div>
  <div class="moves" id="moves"></div>
  <div class="tip" style="margin-top:8px">
    点自己的棋子 → 蓝点是能走的位置 → 点蓝点走棋。联机要两个登录账号：一人建房间拿号码，另一人输号码加入，红方先行。
  </div>
</div>


<script src="xiangqi.js"></script>
<script>
(function () {
  var XQ = window.XQ;
  var START = XQ.START_FEN;

  var el = {
    board: document.getElementById("board"),
    inner: document.getElementById("inner"),
    grid: document.getElementById("grid"),
    lock: document.getElementById("lock"),
    status: document.getElementById("status"),
    hintText: document.getElementById("hintText"),
    dot: document.getElementById("dot"),
    moves: document.getElementById("moves"),
    aiOpts: document.getElementById("aiOpts"),
    onlineOpts: document.getElementById("onlineOpts"),
    roomInput: document.getElementById("roomInput"),
    roomInfo: document.getElementById("roomInfo"),
    roomCode: document.getElementById("roomCode"),
    joinBtn: document.getElementById("joinBtn"),
    newBtn: document.getElementById("newBtn"),
    copyBtn: document.getElementById("copyBtn"),
    leaveBtn: document.getElementById("leaveBtn"),
    undoBtn: document.getElementById("undoBtn"),
    restartBtn: document.getElementById("restartBtn"),
    resignBtn: document.getElementById("resignBtn")
  };

  var S = {
    mode: "ai",              // self | online | ai
    fen: START,
    side: "r",               // 该谁走：r 红 / b 黑
    history: [],             // 每步 {mv, fen, side, text}
    over: false,
    result: "",
    selected: null,
    lastMove: null,
    humanSide: "r",          // 人机模式里我执哪方
    level: 3,
    myId: "",
    room: "",                // 房间号
    myColor: "",             // 联机时我是 r 还是 b
    rivalNick: "",
    rivalArrived: false,
    thinking: false,
    posHist: [],             // 最近的局面 FEN，给引擎做重复局面惩罚
    thinkDepth: 0,
    thinkNodes: 0,
    mustPick: false,         // 人机模式：还没选难度，棋盘先锁住
    check: false,            // 当前走方是否正被将军
    curMoves: [],            // 选中棋子的合法走法
    pollTimer: null,
    lastStamp: ""
  };

  // ---------------- 棋盘绘制 ----------------
  function drawGrid() {
    // 线宽以“格”为单位，棋盘铺满屏时线条等比变粗，不会缩成细丝
    var LW = 0.036, OW = 0.058;
    var p = [];
    p.push('<g stroke="#8a6240" fill="none" stroke-linecap="round">');
    // 横线（上下边框加粗）
    for (var y = 0; y <= 9; y++) {
      p.push('<line x1="0" y1="' + y + '" x2="8" y2="' + y + '" stroke-width="' +
        ((y === 0 || y === 9) ? OW : LW) + '"/>');
    }
    // 竖线（左右边框加粗，中间在楚河汉界处断开）
    for (var x = 0; x <= 8; x++) {
      if (x === 0 || x === 8) {
        p.push('<line x1="' + x + '" y1="0" x2="' + x + '" y2="9" stroke-width="' + OW + '"/>');
      } else {
        p.push('<line x1="' + x + '" y1="0" x2="' + x + '" y2="4" stroke-width="' + LW + '"/>');
        p.push('<line x1="' + x + '" y1="5" x2="' + x + '" y2="9" stroke-width="' + LW + '"/>');
      }
    }
    // 九宫斜线
    p.push('<g stroke-width="' + LW + '">');
    p.push('<line x1="3" y1="0" x2="5" y2="2"/><line x1="5" y1="0" x2="3" y2="2"/>');
    p.push('<line x1="3" y1="7" x2="5" y2="9"/><line x1="5" y1="7" x2="3" y2="9"/>');
    p.push('</g>');
    // 炮位、兵位的星位小十字
    var marks = [[1, 2], [7, 2], [1, 7], [7, 7], [2, 3], [6, 3], [2, 6], [6, 6]];
    var a = 0.09, b = 0.17;
    p.push('<g stroke-width="' + (LW * 0.8) + '" opacity="0.8">');
    for (var i = 0; i < marks.length; i++) {
      var mx = marks[i][0], my = marks[i][1];
      p.push('<line x1="' + (mx - b) + '" y1="' + my + '" x2="' + (mx - a) + '" y2="' + my + '"/>');
      p.push('<line x1="' + (mx + a) + '" y1="' + my + '" x2="' + (mx + b) + '" y2="' + my + '"/>');
      p.push('<line x1="' + mx + '" y1="' + (my - b) + '" x2="' + mx + '" y2="' + (my - a) + '"/>');
      p.push('<line x1="' + mx + '" y1="' + (my + a) + '" x2="' + mx + '" y2="' + (my + b) + '"/>');
    }
    p.push('</g>');
    p.push('</g>');
    el.grid.innerHTML = p.join("");
  }

  function posStyle(x, y) {
    return "left:" + (x / 8 * 100) + "%;top:" + (y / 9 * 100) + "%";
  }

  var CH = { K: "帅", A: "仕", B: "相", N: "马", R: "车", C: "炮", P: "兵",
             k: "将", a: "士", b: "象", n: "马", r: "车", c: "炮", p: "卒" };

  function render() {
    var b = XQ.parseFEN(S.fen);
    var olds = el.inner.querySelectorAll(".piece,.hint");
    for (var i = 0; i < olds.length; i++) { olds[i].remove(); }

    // 当前这一方是不是正被将军（红黑都算，状态条要提示）
    S.check = !S.over && XQ.inCheck(b, S.side);

    for (var y = 0; y < 10; y++) {
      for (var x = 0; x < 9; x++) {
        var pc = b[XQ.idx(x, y)];
        if (!pc) { continue; }
        var d = document.createElement("div");
        d.className = "piece " + (XQ.isRed(pc) ? "red" : "black") +
          (S.selected && S.selected.x === x && S.selected.y === y ? " sel" : "") +
          (S.lastMove && ((S.lastMove.tx === x && S.lastMove.ty === y) || (S.lastMove.fx === x && S.lastMove.fy === y)) ? " last" : "");
        d.textContent = CH[pc];
        d.style.cssText = posStyle(x, y);
        d.dataset.x = x; d.dataset.y = y;
        d.addEventListener("pointerdown", onPieceDown);
        el.inner.appendChild(d);
      }
    }

    // 可走点
    S.curMoves = [];
    if (S.selected && !S.over && canPlay()) {
      S.curMoves = XQ.legalMoves(b, S.side).filter(function (m) {
        return m.fx === S.selected.x && m.fy === S.selected.y;
      });
      S.curMoves.forEach(function (m) {
        var h = document.createElement("div");
        h.className = "hint" + (m.cap ? " cap" : "");
        h.style.cssText = posStyle(m.tx, m.ty);
        h.dataset.tx = m.tx; h.dataset.ty = m.ty;
        h.addEventListener("pointerdown", onHintDown);
        el.inner.appendChild(h);
      });
    }

    renderMoves();
    updateStatus();
  }

  function renderMoves() {
    var html = [];
    for (var i = 0; i < S.history.length; i++) {
      var h = S.history[i];
      html.push('<span class="no">' + (i + 1) + '.</span><span class="' + (h.side === "r" ? "r" : "b") + '">' + h.text + "</span>");
      if (i % 4 === 3 || i === S.history.length - 1) { html.push("<br>"); }
      else { html.push("　"); }
    }
    el.moves.innerHTML = html.join("") || '<span class="no">还没有走棋</span>';
    el.moves.scrollTop = el.moves.scrollHeight;
  }

  function updateStatus() {
    if (S.over) { el.status.innerHTML = "<b>" + S.result + "</b>"; return; }
    if (S.mustPick) { el.status.innerHTML = "先选一个难度，点完立刻开局"; return; }
    if (S.check) {
      var who = (S.mode !== "ai" || S.side === S.humanSide) ? "你" : "电脑";
      var tag = (S.mode !== "ai" || S.side === S.humanSide) ? "<b style='color:#ff6b6b'>⚠ " + who + "被将军了</b>" : "⚠ " + who + "被将军了";
      var tail = (S.mode !== "ai" || S.side === S.humanSide) ? "——必须先把将应掉（挪将 / 垫子 / 吃掉将军的子）" : "——正在应将";
      el.status.innerHTML = tag + " <span style='opacity:.75'>" + tail + "</span>";
      return;
    }
    if (S.mode === "self") {
      el.status.innerHTML = "轮到你走：<b>" + (S.side === "r" ? "红方" : "黑方") + "</b>（两边都由你操作）";
    } else if (S.mode === "ai") {
      if (S.thinking) {
        el.status.innerHTML = "电脑在想…<span style='opacity:.7'>第 " + (S.thinkDepth || 1) + " 层 · " +
          Math.round((S.thinkNodes || 0) / 10000) + " 万局面</span>";
      } else {
        el.status.innerHTML = S.side === S.humanSide ? "轮到你走（你执<b>" + (S.humanSide === "r" ? "红" : "黑") + "</b>）"
          : "电脑走棋中…";
      }
    } else if (S.mode === "online") {
      if (!S.room) { el.status.innerHTML = "建房间或输入房间号加入"; return; }
      if (!S.myColor) { el.status.innerHTML = "正在进入房间…"; return; }
      if (S.rivalNick === "" && !S.rivalArrived) { el.status.innerHTML = "房间号 <b>" + S.room + "</b> · 等对手加入…"; return; }
      el.status.innerHTML = S.side === S.myColor
        ? "轮到你走（你执<b>" + (S.myColor === "r" ? "红" : "黑") + "</b>）"
        : "等对方走（对手 <b>" + (S.rivalNick || "对手") + "</b>）";
    }
  }

  function canPlay() {
    if (S.over || S.mustPick) { return false; }
    if (S.mode === "self") { return true; }
    if (S.mode === "ai") { return S.side === S.humanSide && !S.thinking; }
    if (S.mode === "online") { return !!S.myColor && S.rivalArrived && S.side === S.myColor; }
    return false;
  }

  // ---------------- 走棋 ----------------
  function onPieceDown(e) {
    e.preventDefault();
    var x = parseInt(e.currentTarget.dataset.x, 10), y = parseInt(e.currentTarget.dataset.y, 10);
    if (!canPlay()) { return; }
    var b = XQ.parseFEN(S.fen);
    var pc = b[XQ.idx(x, y)];
    if (!pc) { return; }
    if (XQ.sideOf(pc) !== S.side) { S.selected = null; render(); return; }
    S.selected = (S.selected && S.selected.x === x && S.selected.y === y) ? null : { x: x, y: y };
    render();
  }

  function onHintDown(e) {
    e.preventDefault();
    if (!canPlay() || !S.selected) { return; }
    var tx = parseInt(e.currentTarget.dataset.tx, 10), ty = parseInt(e.currentTarget.dataset.ty, 10);
    var b = XQ.parseFEN(S.fen);
    var ms = XQ.legalMoves(b, S.side).filter(function (m) {
      return m.fx === S.selected.x && m.fy === S.selected.y && m.tx === tx && m.ty === ty;
    });
    if (!ms.length) { return; }
    doMove(b, ms[0], true);
  }

  // 点到走不到的位置 → 说明原因，别让人以为是"点了没反应"
  el.inner.addEventListener("pointerdown", function (e) {
    var tg = e.target;
    if (tg && tg.classList && (tg.classList.contains("piece") || tg.classList.contains("hint"))) { return; }
    if (!S.selected || !canPlay()) { return; }
    var r = el.inner.getBoundingClientRect();
    if (!r.width || !r.height) { return; }
    var gx = Math.round((e.clientX - r.left) / (r.width / 8));
    var gy = Math.round((e.clientY - r.top) / (r.height / 9));
    if (gx < 0 || gx > 8 || gy < 0 || gy > 9) { return; }
    for (var i = 0; i < S.curMoves.length; i++) {
      if (S.curMoves[i].tx === gx && S.curMoves[i].ty === gy) { return; }
    }
    var b = XQ.parseFEN(S.fen);
    var pseudo = XQ.genMoves(b, S.side).filter(function (m) {
      return m.fx === S.selected.x && m.fy === S.selected.y && m.tx === gx && m.ty === gy;
    });
    if (!pseudo.length) {
      el.hintText.textContent = "这个子走不到那个位置";
      return;
    }
    var bb = XQ.parseFEN(S.fen);
    XQ.make(bb, pseudo[0]);
    if (XQ.inCheck(bb, S.side)) {
      el.hintText.textContent = S.check ? "这步不行——你还被将军，走完老将还是会被吃" : "这步不行——走完老将会被将军";
    } else {
      el.hintText.textContent = "这步不行——走完两边老将会照面（同一条线上中间没有子）";
    }
  }, true);

  function doMove(b, mv, writeBack) {
    var text = XQ.moveText(b, mv);
    var mover = S.side;
    XQ.make(b, mv);
    S.history.push({ mv: mv, fen: S.fen, side: mover, text: text });
    S.fen = XQ.toFEN(b, XQ.other(mover));
    S.side = XQ.other(mover);
    S.lastMove = mv;
    S.selected = null;
    S.posHist.push(S.fen);
    if (S.posHist.length > 14) { S.posHist.shift(); }

    var end = XQ.gameOver(b, S.side);
    if (end.over) {
      S.over = true;
      var winner = end.winner === "r" ? "红方" : "黑方";
      if (S.mode === "ai") { S.result = end.winner === S.humanSide ? "你赢了（" + end.reason + "）" : "你输了（" + end.reason + "）"; }
      else if (S.mode === "online") { S.result = (end.winner === S.myColor ? "你赢了" : "你输了") + "（" + end.reason + "）"; }
      else { S.result = winner + "胜（" + end.reason + "）"; }
    }
    render();

    if (S.mode === "online" && writeBack) { pushOnline(); }
    if (S.mode === "ai" && !S.over && S.side !== S.humanSide && !S.thinking) { aiTurn(); }
  }

  // ---------------- 电脑走棋（放在 Worker 里算，界面不卡） ----------------
  var AIW = null, AIID = 0;

  function stopAI() {
    AIID++;
    if (AIW) { try { AIW.terminate(); } catch (e) {} AIW = null; }
    S.thinking = false;
    S.thinkDepth = 0;
    S.thinkNodes = 0;
  }

  function aiFallback() {
    if (S.over || S.side === S.humanSide) { S.thinking = false; render(); return; }
    setTimeout(function () {
      var mv = XQ.bestMove(S.fen, S.side, Math.min(S.level, 4));
      S.thinking = false;
      if (!mv || S.over || S.side === S.humanSide) { render(); return; }
      doMove(XQ.parseFEN(S.fen), mv, false);
    }, 60);
  }

  function onAI(e) {
    var d = e.data || {};
    if (d.id !== AIID) { return; }
    if (d.type === "info") {
      S.thinkDepth = d.depth;
      S.thinkNodes = d.nodes;
      updateStatus();
      return;
    }
    if (d.type === "error") { AIW = null; stopAI(); aiFallback(); return; }
    if (d.type === "move") {
      S.thinking = false;
      S.thinkDepth = 0;
      S.thinkNodes = 0;
      if (!d.mv || S.over) { render(); return; }
      doMove(XQ.parseFEN(S.fen), d.mv, false);
    }
  }

  function ensureWorker() {
    if (AIW) { return AIW; }
    if (!window.Worker) { return null; }
    try {
      AIW = new Worker("xiangqi_ai.js");
      AIW.onmessage = onAI;
      AIW.onerror = function () { AIW = null; stopAI(); aiFallback(); };
    } catch (err) { AIW = null; }
    return AIW;
  }

  function aiTurn() {
    if (S.thinking || S.over) { return; }
    S.thinking = true;
    S.thinkDepth = 0;
    S.thinkNodes = 0;
    updateStatus();
    var w = ensureWorker();
    if (!w) { aiFallback(); return; }
    AIID++;
    try {
      w.postMessage({
        type: "go", id: AIID, fen: S.fen, side: S.side, level: S.level,
        repList: S.posHist.slice(-10),
        msCap: S.history.length < 8 ? 1200 : 0     // 开局阶段不必长考，快点落子
      });
    } catch (err) { AIW = null; aiFallback(); }
  }

  // ---------------- 联机 ----------------
  function pushOnline() {
    if (!S.room) { return; }
    SYNC.xqSave(S.room, {
      state: { fen: S.fen, moves: S.history.map(function (h) { return h.text; }),
               over: S.over, result: S.result },
      status: S.over ? "done" : "playing"
    }).catch(function () {});
  }

  function genCode() {
    var s = "";
    for (var i = 0; i < 6; i++) { s += Math.floor(Math.random() * 10); }
    return s;
  }

  // 云端可能还没加载完（supabase.js 懒加载），点按钮时再等它一次
  function ensureId() {
    if (S.myId) { return Promise.resolve(S.myId); }
    if (!window.SYNC) { return Promise.resolve(""); }
    el.hintText.textContent = "正在连云端…";
    return SYNC.ready().then(function () {
      return SYNC.myId();
    }).then(function (id) {
      S.myId = id || "";
      return S.myId;
    }).catch(function () { return ""; });
  }

  function createRoom() {
    ensureId().then(function (id) {
      if (!id) { el.hintText.textContent = "云端没连上：等一两秒再点一次「建房间」"; return null; }
      var code = genCode();
      return SYNC.profile().then(function (p) {
        return SYNC.xqNew(code, { fen: START, moves: [] }, p.nick || "");
      }).then(function () {
        S.room = code; S.myColor = "r"; S.rivalNick = ""; S.rivalArrived = false;
        S.fen = START; S.side = "r"; S.history = []; S.over = false; S.result = ""; S.lastMove = null;
        S.lastStamp = "";
        el.roomInfo.style.display = "flex";
        el.roomCode.textContent = code;
        el.hintText.textContent = "房间建好了，把号码告诉对方";
        render();
        startPoll();
      });
    }).catch(function (err) {
      el.hintText.textContent = "建房失败：" + (err && err.message ? err.message : "网络问题");
    });
  }

  function joinRoom() {
    var code = (el.roomInput.value || "").replace(/[^0-9]/g, "");
    if (code.length !== 6) { el.hintText.textContent = "房间号要 6 位数字"; return; }
    ensureId().then(function (id) {
      if (!id) { el.hintText.textContent = "云端没连上：等一两秒再点一次「加入房间」"; return null; }
      return SYNC.profile().then(function (p) {
        return SYNC.xqJoin(code, { fen: START, moves: [] }, p.nick || "");
      }).then(function (ok) {
        if (!ok) { el.hintText.textContent = "房间里已经有人了，换一个房间号"; return; }
        S.room = code; S.myColor = "b"; S.rivalArrived = true; S.thinking = false;
        S.lastStamp = "";
        el.roomInfo.style.display = "flex";
        el.roomCode.textContent = code;
        el.hintText.textContent = "已加入，红方先行";
        render();
        startPoll(true);
      });
    }).catch(function (err) {
      el.hintText.textContent = "加入失败：" + (err && err.message ? err.message : "网络问题");
    });
  }

  function startPoll(now) {
    stopPoll();
    if (now) { poll(); }
    S.pollTimer = setInterval(poll, 2000);
  }

  function stopPoll() {
    if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
  }

  function poll() {
    if (!S.room) { return; }
    SYNC.xqGet(S.room).then(function (row) {
      if (!row) {
        el.hintText.textContent = "房间不存在了（可能对方退出了）";
        stopPoll();
        return;
      }
      if (row.status === "waiting") {
        S.rivalArrived = false;
        updateStatus();
        return;
      }
      // 有人来了
      if (!S.rivalArrived) {
        S.rivalArrived = true;
        S.rivalNick = S.myColor === "r" ? (row.black_nick || "对手") : (row.red_nick || "对手");
        updateStatus();
      } else {
        S.rivalNick = S.myColor === "r" ? (row.black_nick || S.rivalNick) : (row.red_nick || S.rivalNick);
      }
      var st = row.state || {};
      var stamp = (row.updated_at || "") + "|" + (st.fen || "") + "|" + (st.over ? "1" : "0");
      if (stamp !== S.lastStamp) {
        S.lastStamp = stamp;
        // 对方认输/结束：哪怕棋盘没变也要显示结果
        if (st.over && !S.over) {
          S.over = true;
          S.result = st.result || "对手已结束本局";
          render();
          return;
        }
        // 只有对方走了才需要同步（自己走的时候本地已经更新过）
        if (st.fen && st.fen !== S.fen) {
          S.fen = st.fen;
          S.side = st.fen.split(" ")[1] || "r";
          S.history = (st.moves || []).map(function (t, i) {
            return { text: t, side: i % 2 === 0 ? "r" : "b" };
          });
          var b = XQ.parseFEN(S.fen);
          var end = XQ.gameOver(b, S.side);
          if (end.over) {
            S.over = true;
            S.result = (end.winner === S.myColor ? "你赢了" : "你输了") + "（" + end.reason + "）";
          }
          S.selected = null;
          render();
        } else {
          updateStatus();
        }
      }
    }).catch(function (err) { el.hintText.textContent = '同步出错：' + ((err && err.message) || '网络'); });
  }

  window.XQDBG = S;

  function leaveRoom() {
    stopPoll();
    if (S.room) { SYNC.xqDrop(S.room).catch(function () {}); }
    S.room = ""; S.myColor = ""; S.rivalArrived = false; S.lastStamp = "";
    el.roomInfo.style.display = "none";
    render();
  }

  // ---------------- 模式切换 / 按钮 ----------------
  function setMode(m) {
    S.mode = m;
    S.selected = null;
    S.mustPick = false;
    if (S.mode !== "online") { stopPoll(); if (S.room) { leaveRoomSilently(); } }
    el.aiOpts.style.display = m === "ai" ? "block" : "none";
    el.onlineOpts.style.display = m === "online" ? "block" : "none";
    el.resignBtn.style.display = m === "online" ? "" : "none";
    document.querySelectorAll(".modes button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.mode === m);
    });
    if (m === "ai") {
      S.mustPick = true;
      reset();
      openPanel(true);
      el.hintText.textContent = "先选个难度，点一下就开始";
    }
    else if (m === "self") { reset(); }
    else { reset(); el.hintText.textContent = "建房间，或输入 6 位房间号加入"; }
    render();
  }

  function leaveRoomSilently() {
    if (S.room) { SYNC.xqDrop(S.room).catch(function () {}); }
    S.room = ""; S.myColor = ""; S.rivalArrived = false; S.lastStamp = "";
    el.roomInfo.style.display = "none";
  }

  function reset() {
    stopAI();
    S.fen = START; S.side = "r"; S.history = []; S.over = false; S.result = "";
    S.selected = null; S.lastMove = null;
    S.posHist = [S.fen];
    el.hintText.textContent = "";
    render();
  }

  function undo() {
    if (S.mode === "online") { el.hintText.textContent = "联机模式不能悔棋"; return; }
    stopAI();
    var steps = S.mode === "ai" ? 2 : 1;
    while (steps > 0 && S.history.length) {
      var h = S.history.pop();
      S.fen = h.fen;
      S.side = h.side;
      steps--;
    }
    S.over = false; S.result = ""; S.selected = null;
    S.lastMove = S.history.length ? S.history[S.history.length - 1].mv : null;
    S.posHist = S.history.map(function (x) { return x.fen; });
    S.posHist.push(S.fen);
    render();
    if (S.mode === "ai" && !S.over && S.side !== S.humanSide) { aiTurn(); }
  }

  var panel = document.getElementById("panel");
  function openPanel(on) {
    if (!panel) return;
    panel.classList.toggle("open", on);
  }
  document.getElementById("menuBtn").addEventListener("click", function () {
    openPanel(!panel.classList.contains("open"));
  });
  // 点棋盘也能收起菜单，方便全屏看棋（点状态条上的按钮不算）
  el.board.addEventListener("pointerdown", function (e) {
    if (e.target && e.target.closest && e.target.closest(".topbar")) { return; }
    if (panel.classList.contains("open")) { openPanel(false); }
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { openPanel(false); }
  });

  // 菜单关着时，提示文字用底部气泡显示，不憋在菜单里
  var toast = document.getElementById("toast"), toastTimer = null;
  new MutationObserver(function () {
    var t = (el.hintText.textContent || "").trim();
    if (!t || panel.classList.contains("open")) { return; }
    toast.textContent = t;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2600);
  }).observe(el.hintText, { childList: true, characterData: true, subtree: true });

  // 头一回进来给菜单按钮打个呼吸光，提醒从这儿选模式
  setTimeout(function () {
    var mb = document.getElementById("menuBtn");
    mb.classList.add("pulse");
    setTimeout(function () { mb.classList.remove("pulse"); }, 5000);
  }, 300);

  // auth.js 的账号小挂件固定在右上角，会压住棋盘右上角的棋子，这个页面收起来
  function hideSiteChip() {
    var ds = document.querySelectorAll("body > div");
    for (var i = 0; i < ds.length; i++) {
      var d = ds[i];
      if (d.dataset.xqHide === "1") { continue; }
      if (d.style && d.style.position === "fixed" && /退出/.test(d.textContent || "")) {
        d.dataset.xqHide = "1";
        d.style.display = "none";
      }
    }
  }
  hideSiteChip();
  new MutationObserver(hideSiteChip).observe(document.body, { childList: true });

  document.querySelectorAll(".modes button").forEach(function (b) {
    b.addEventListener("click", function () {
      setMode(b.dataset.mode);
      if (b.dataset.mode !== "online") { openPanel(false); }
    });
  });

  document.querySelectorAll(".lv").forEach(function (b) {
    b.addEventListener("click", function () {
      S.level = parseInt(b.dataset.lv, 10);
      document.querySelectorAll(".lv").forEach(function (o) { o.classList.toggle("pri", o === b); });
      el.hintText.textContent = "难度：" + b.textContent;
      if (S.mode === "ai" && (S.mustPick || S.history.length === 0)) {
        S.mustPick = false;
        reset();
        openPanel(false);
        el.hintText.textContent = "难度：" + b.textContent + "，开局";
        if (S.humanSide === "b") { aiTurn(); }
      }
    });
  });

  el.newBtn.addEventListener("click", createRoom);
  el.joinBtn.addEventListener("click", joinRoom);
  el.leaveBtn.addEventListener("click", leaveRoom);
  el.copyBtn.addEventListener("click", function () {
    var t = S.room;
    if (!t) { return; }
    if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function () { el.hintText.textContent = "房间号已复制"; }); }
    else { el.roomInput.value = t; el.roomInput.select(); }
  });
  el.restartBtn.addEventListener("click", function () {
    if (S.mode === "online") {
      if (!S.myColor) { return; }
      S.fen = START; S.side = "r"; S.history = []; S.over = false; S.result = ""; S.lastMove = null;
      render(); pushOnline();
    } else {
      if (S.mode === "ai" && S.mustPick) { openPanel(true); el.hintText.textContent = "先选个难度，点一下难度按钮就开局"; return; }
      reset(); if (S.mode === "ai" && S.humanSide === "b") { aiTurn(); }
    }
  });
  el.undoBtn.addEventListener("click", undo);
  el.resignBtn.addEventListener("click", function () {
    if (!S.room || S.over) { return; }
    S.over = true;
    S.result = "你认输了";
    render();
    SYNC.xqSave(S.room, {
      status: "done",
      state: {
        fen: S.fen,
        moves: S.history.map(function (h) { return h.text; }),
        over: true,
        result: S.myColor === "r" ? "黑方胜（对手认输）" : "红方胜（对手认输）"
      }
    }).catch(function () {});
  });

  // 初始化
  drawGrid();
  document.querySelector('.lv[data-lv="3"]').classList.add("pri");
  setMode("ai");

  // 提前把云端拉起来（supabase.js 108KB，早点下载，点按钮时就不用等）
  if (window.SYNC) {
    S.myId = "";
    var tryId = 0;
    function getId() {
      tryId++;
      SYNC.ready().then(function () { return SYNC.myId(); }).then(function (id) {
        S.myId = id || "";
        if (!S.myId) { el.dot.className = "dot off"; }
        else { el.dot.className = "dot"; }
        if (!S.myId && tryId < 4) { setTimeout(getId, 3000); }
      }).catch(function () {
        if (tryId < 4) { setTimeout(getId, 3000); }
      });
    }
    getId();
  } else {
    el.dot.className = "dot off";
    el.hintText.textContent = "云端没连上，只能玩单机和人机";
  }
})();
</script>
</body>
</html>
