<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101521">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="软件柜">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>打地鼠</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 34px;
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #1d2b40 0%, #101521 60%);
    color: #e9eef7; text-align: center; min-height: 100vh;
  }
  .back {
    position: fixed; right: 14px; bottom: 14px; z-index: 5;
    font-size: 13px; color: #cfe0ff; text-decoration: none;
    background: #2b7cff; padding: 9px 14px; border-radius: 20px;
    box-shadow: 0 6px 18px #2b7cff55;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8ea0b8; margin: 0 0 14px; }

  .hud { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  .box {
    background: #1a2434; border: 1px solid #24314a; border-radius: 12px;
    padding: 8px 14px; min-width: 76px;
  }
  .box span { display: block; font-size: 11px; color: #8ea0b8; }
  .box b { font-size: 18px; }

  .timeline { height: 6px; background: #1a2434; border-radius: 4px; overflow: hidden; margin: 0 auto 16px; max-width: 340px; }
  .timebar { height: 100%; width: 100%; background: linear-gradient(90deg, #16c47f, #2b7cff); transition: width 1s linear; }

  #board {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px; justify-content: center; max-width: 340px; margin: 0 auto 16px;
  }
  .hole {
    aspect-ratio: 1 / 1; border-radius: 14px; background: #1a2434;
    border: 1px solid #233048; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; transition: transform 0.08s, background 0.12s;
  }
  .hole.mole { background: linear-gradient(180deg, #ffd166, #f5b42a); border-color: #ffd166; transform: translateY(-3px); }
  .hole.hit { animation: pop 0.2s ease; }
  .hole.miss { animation: shake 0.18s ease; background: #3a2230; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }

  .start {
    font-size: 16px; padding: 12px 30px; border: none; border-radius: 12px;
    background: #2b7cff; color: #fff; cursor: pointer; font-weight: 600;
  }
  .start:hover { background: #1a66e0; }

  #result {
    max-width: 340px; margin: 0 auto; background: #16203099; border: 1px solid #24314a;
    border-radius: 16px; padding: 16px; display: none;
  }
  #result .big { font-size: 26px; font-weight: 700; margin: 4px 0 10px; color: #ffd166; }
  .stats { display: flex; justify-content: space-around; font-size: 12px; color: #9db0cc; }
  .stats b { display: block; font-size: 17px; color: #e9eef7; margin-top: 3px; }
  .bestline { margin-top: 12px; font-size: 13px; color: #16c47f; }
  .tip { font-size: 12px; color: #7d90ab; margin-top: 14px; line-height: 1.8; }
</style>
</head>
<body>
<h1>打地鼠</h1>
<p class="sub">30 秒 · 越到后面出现越快 · 连击有加成 · 敲空扣分</p>

<div class="hud">
  <div class="box"><span>得分</span><b id="score">0</b></div>
  <div class="box"><span>连击</span><b id="streak">0</b></div>
  <div class="box"><span>剩余</span><b id="left">30</b></div>
  <div class="box"><span>最高</span><b id="best">0</b></div>
</div>

<div class="timeline"><div class="timebar" id="timebar"></div></div>

<div id="board"></div>

<div id="result">
  <div style="font-size:13px;color:#8ea0b8">这一局</div>
  <div class="big" id="rScore">0 分</div>
  <div class="stats">
    <div>打中<b id="rHit">0</b></div>
    <div>漏掉<b id="rMiss">0</b></div>
    <div>命中率<b id="rRate">0%</b></div>
    <div>最长连击<b id="rStreak">0</b></div>
  </div>
  <div class="bestline" id="rBest"></div>
  <button class="start" style="margin-top:14px" onclick="startGame()">再来一局</button>
</div>

<button class="start" id="btnStart" onclick="startGame()">开始游戏</button>
<p class="tip">用鼠标或手指点有老鼠的洞。连击 5 次以上每次多加分，敲空洞扣 1 分。</p>

<a class="back" href="index.html">← 软件柜</a>

<script>
  const HOLES = 9;
  const TOTAL_SEC = 30;
  const board = document.getElementById("board");

  let score = 0, hit = 0, miss = 0, streak = 0, maxStreak = 0;
  let left = TOTAL_SEC, running = false, moleIndex = -1, startedAt = 0;
  let spawnTimer = null, hideTimer = null, tickTimer = null;
  let audioCtx = null;

  for (let i = 0; i < HOLES; i++) {
    const d = document.createElement("div");
    d.className = "hole";
    d.dataset.i = i;
    d.onclick = function () { clickHole(i, d); };
    board.appendChild(d);
  }

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.value = 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function best() { return Number(localStorage.getItem("whackBest") || 0); }

  function hud() {
    document.getElementById("score").textContent = score;
    document.getElementById("streak").textContent = streak;
    document.getElementById("left").textContent = left;
    document.getElementById("best").textContent = best();
    document.getElementById("timebar").style.width = (left / TOTAL_SEC * 100) + "%";
  }

  function clearMole() {
    for (const h of board.children) {
      h.classList.remove("mole");
      h.textContent = "";
    }
    moleIndex = -1;
  }

  // 难度：时间越往后，出现间隔和停留时间都变短
  function spawnGap() {
    const played = TOTAL_SEC - left;
    return Math.max(360, 950 - played * 20);
  }
  function stayMs() { return Math.max(430, 800 - (TOTAL_SEC - left) * 13); }

  function looseMiss() {
    miss = miss + 1;
    streak = 0;
    hud();
  }

  function spawn() {
    clearMole();
    moleIndex = Math.floor(Math.random() * HOLES);
    const hole = board.children[moleIndex];
    hole.classList.add("mole");
    hole.textContent = "🐭";
    hideTimer = setTimeout(function () {
      if (!running) { return; }
      if (hole.textContent === "🐭") {
        looseMiss();
        hole.classList.remove("mole");
        hole.textContent = "";
        moleIndex = -1;
      }
      spawnTimer = setTimeout(spawn, spawnGap());
    }, stayMs());
  }

  function clickHole(i, el) {
    if (!running) { return; }
    if (i === moleIndex) {
      hit = hit + 1;
      streak = streak + 1;
      if (streak > maxStreak) { maxStreak = streak; }
      let add = 1;
      if (streak >= 10) { add = 3; } else if (streak >= 5) { add = 2; }
      score = score + add;
      el.classList.add("hit");
      beep(900, 0.06, "square");
      setTimeout(function () { el.classList.remove("hit"); }, 200);
      clearMole();
      hud();
    } else {
      miss = miss + 1;
      streak = 0;
      score = Math.max(0, score - 1);
      el.classList.add("miss");
      beep(240, 0.1, "sawtooth");
      setTimeout(function () { el.classList.remove("miss"); }, 180);
      hud();
    }
  }

  function startGame() {
    if (running) { return; }
    running = true;
    score = 0; hit = 0; miss = 0; streak = 0; maxStreak = 0; left = TOTAL_SEC;
    document.getElementById("result").style.display = "none";
    document.getElementById("btnStart").style.display = "none";
    hud();
    spawn();
    tickTimer = setInterval(function () {
      left = left - 1;
      if (left <= 0) { endGame(); } else { hud(); }
    }, 1000);
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer); clearTimeout(hideTimer); clearInterval(tickTimer);
    clearMole();
    left = 0;
    hud();
    document.getElementById("btnStart").style.display = "inline-block";
    document.getElementById("btnStart").textContent = "再玩一局";

    const oldBest = best();
    if (score > oldBest) { localStorage.setItem("whackBest", String(score)); }

    const shots = hit + miss;
    const rate = shots === 0 ? 0 : Math.round(hit / shots * 100);
    document.getElementById("rScore").textContent = score + " 分";
    document.getElementById("rHit").textContent = hit;
    document.getElementById("rMiss").textContent = miss;
    document.getElementById("rRate").textContent = rate + "%";
    document.getElementById("rStreak").textContent = maxStreak;
    document.getElementById("rBest").textContent = score > oldBest
      ? "🎉 破纪录了！之前的最高分是 " + oldBest
      : "历史最高 " + oldBest + " 分，还差 " + (oldBest - score) + " 分";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  hud();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
