<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101521">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="image" href="libai.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="软件柜">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>打地鼠</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 34px; min-height: 100vh;
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #1d2b40 0%, #101521 60%);
    color: #e9eef7; text-align: center;
    user-select: none;
  }
  .back {
    position: fixed; right: 14px; bottom: 14px; z-index: 5;
    font-size: 13px; color: #cfe0ff; text-decoration: none;
    background: #2b7cff; padding: 9px 14px; border-radius: 20px;
    box-shadow: 0 6px 18px #2b7cff55;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8ea0b8; margin: 0 0 14px; }

  .hud { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  .box { background: #1a2434; border: 1px solid #24314a; border-radius: 12px; padding: 8px 14px; min-width: 74px; }
  .box span { display: block; font-size: 11px; color: #8ea0b8; }
  .box b { font-size: 18px; }

  .timeline { height: 6px; background: #1a2434; border-radius: 4px; overflow: hidden; margin: 0 auto 16px; max-width: 340px; }
  .timebar { height: 100%; width: 100%; background: linear-gradient(90deg, #16c47f, #2b7cff); }

  #board {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px; justify-content: center; max-width: 340px; margin: 0 auto 16px;
    touch-action: manipulation; cursor: pointer;
  }
  .hole {
    aspect-ratio: 1 / 1; border-radius: 14px; background: #1a2434;
    border: 1px solid #233048; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; transition: transform 0.06s, background 0.08s, box-shadow 0.08s;
  }
  .hole.mole {
    background: linear-gradient(180deg, #ffd166, #f5b42a); border-color: #ffd166;
    box-shadow: 0 0 0 3px #ffd16655, 0 8px 20px #f5b42a55;
  }
  .hole .hero {
    width: 82%; height: 82%; object-fit: contain;
    display: none; pointer-events: none; user-select: none;
  }
  .hole.mole .hero { display: block; }
  .hole.hit { animation: pop 0.16s ease; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }

  .start {
    font-size: 16px; padding: 12px 30px; border: none; border-radius: 12px;
    background: #2b7cff; color: #fff; cursor: pointer; font-weight: 600;
  }
  .start:hover { background: #1a66e0; }

  #result {
    max-width: 340px; margin: 0 auto; background: #16203099; border: 1px solid #24314a;
    border-radius: 16px; padding: 16px; display: none;
  }
  #result .big { font-size: 26px; font-weight: 700; margin: 4px 0 10px; color: #ffd166; }
  .stats { display: flex; justify-content: space-around; font-size: 12px; color: #9db0cc; }
  .stats b { display: block; font-size: 17px; color: #e9eef7; margin-top: 3px; }
  .bestline { margin-top: 12px; font-size: 13px; color: #16c47f; }

  .board {
    max-width: 340px; margin: 0 auto 16px; background: #16203099; border: 1px solid #24314a;
    border-radius: 16px; padding: 12px 14px; text-align: left;
  }
  .board .t { font-size: 12px; color: #9db0cc; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .board .t span { color: #5f6f85; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9db0cc; padding: 5px 0; border-top: 1px dashed #22314a; }
  .row:first-of-type { border-top: none; }
  .row .rk { width: 20px; color: #7d90ab; }
  .row .rk.g { color: #ffd166; font-weight: 700; }
  .row .sc { width: 62px; color: #e9eef7; font-weight: 600; }
  .row .sp { width: 74px; }
  .row .dt { margin-left: auto; color: #5f6f85; font-size: 11px; }
  .row.me { background: #2b7cff14; border-radius: 8px; }
  .empty { font-size: 12px; color: #7d90ab; padding: 6px 0; text-align: center; }

  .tip { font-size: 12px; color: #7d90ab; margin-top: 14px; line-height: 1.8; }
</style>
<script src="auth.js" data-guard="1"></script>
</head>
<body>
<h1>打地鼠 · 李白版</h1>
<p class="sub">15 秒 · 李白一直在，打掉一个立刻换下一个 · 点格子哪里都算</p>

<div class="hud">
  <div class="box"><span>得分</span><b id="score">0</b></div>
  <div class="box"><span>连击</span><b id="streak">0</b></div>
  <div class="box"><span>剩余</span><b id="left">15</b></div>
  <div class="box"><span>最高</span><b id="best">0</b></div>
</div>

<div class="timeline"><div class="timebar" id="timebar"></div></div>

<div id="board"></div>

<div id="result">
  <div style="font-size:13px;color:#8ea0b8">这一局</div>
  <div class="big" id="rScore">0 只</div>
  <div class="stats">
    <div>打中<b id="rHit">0</b></div>
    <div>平均间隔<b id="rSpeed">0</b></div>
    <div>最长连击<b id="rStreak">0</b></div>
    <div>考级档位<b id="rRank">--</b></div>
  </div>
  <div class="bestline" id="rBest"></div>
  <button class="start" style="margin-top:14px" onclick="startGame()">再来一局</button>
</div>

<button class="start" id="btnStart" onclick="startGame()">开始游戏</button>

<div class="board">
  <div class="t"><b>🏆 打地鼠榜</b><span id="boardTip">本机前 5 名</span></div>
  <div id="boardList"><p class="empty">还没有记录，打一局就上榜</p></div>
</div>

<p class="tip">开始后李白一出现就立刻打，打中马上换下一个，中间没有任何等待。<br>整个格子（连格子边、格子之间的缝）都算命中，手不用点得那么准。</p>

<a class="back" href="index.html">← 软件柜</a>

<script>
  const HOLES = 9;
  const TOTAL_SEC = 15;

  // PK 对局：从好友页带 ?duel=<id>&role=c|o 进来，打完把成绩存下来再跳回好友页
  function duelInfo() {
    try {
      const q = new URLSearchParams(location.search);
      const id = parseInt(q.get("duel"), 10);
      const role = q.get("role");
      if (!id || (role !== "c" && role !== "o")) { return null; }
      return { id: id, role: role };
    } catch (e) { return null; }
  }
  const DUEL = duelInfo();

  const board = document.getElementById("board");

  let score = 0, streak = 0, maxStreak = 0, left = TOTAL_SEC;
  let running = false, moleIdx = -1, startTs = 0, tickId = 0, lastSec = TOTAL_SEC;
  let audioCtx = null;

  for (let i = 0; i < HOLES; i++) {
    const d = document.createElement("div");
    d.className = "hole";
    d.dataset.i = i;
    d.innerHTML = '<img class="hero" src="libai.png" alt="李白" draggable="false">';
    board.appendChild(d);
  }

  // 整块格子板接管点击：按“离哪个洞最近”来判定，点格子内、格子边、格子缝都算
  function nearestHole(x, y) {
    const all = board.getBoundingClientRect();
    // 稍微放宽一点：点到板子外 14px 以内也算
    if (x < all.left - 14 || x > all.right + 14 || y < all.top - 14 || y > all.bottom + 14) { return -1; }
    let best = -1, bestD = Infinity;
    for (let i = 0; i < HOLES; i++) {
      const r = board.children[i].getBoundingClientRect();
      const dx = x - (r.left + r.width / 2);
      const dy = y - (r.top + r.height / 2);
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  board.addEventListener("pointerdown", function (e) {
    if (!running) { return; }
    e.preventDefault();
    const i = nearestHole(e.clientX, e.clientY);
    if (i >= 0) { hitHole(i); }
  }, { passive: false });

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // 每个账号一份榜单；没登录时用 guest
  function boardKey() {
    let u = "guest";
    try { const s = AUTH.user(); if (s && s.email) { u = s.email; } } catch (e) {}
    return "whackBoard:" + u;
  }
  function best() {
    const b = loadBoard();
    return b.length ? b[0].score : Number(localStorage.getItem("whackBest") || 0);
  }
  function loadBoard() {
    try {
      const arr = JSON.parse(localStorage.getItem(boardKey()) || "[]");
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveRecord(rec) {
    const list = loadBoard();
    list.push(rec);
    list.sort(function (a, b) {
      if (b.score !== a.score) { return b.score - a.score; }
      return a.avg - b.avg;
    });
    const top = list.slice(0, 10);
    localStorage.setItem(boardKey(), JSON.stringify(top));
    if (rec.score > Number(localStorage.getItem("whackBest") || 0)) {
      localStorage.setItem("whackBest", String(rec.score));
    }
    syncPush();
    try {
      if (window.SYNC) { window.SYNC.submitScore("whack", rec.score, null, { avg: rec.avg }); }
    } catch (e) {}
    return top;
  }

  // 全站榜单：所有账号（包括新注册的）都能看到，并显示是谁打的
  function renderGlobal() {
    if (!window.SYNC) { return; }
    window.SYNC.topScores("whack", 8, false).then(function (rows) {
      if (!rows || !rows.length) { return; }
      const box = document.getElementById("boardList");
      box.innerHTML = rows.map(function (r, i) {
        return '<div class="row">' +
          '<span class="rk' + (i === 0 ? " g" : "") + '">' + (i + 1) + '</span>' +
          '<span class="nm" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (r.name || "玩家") + '</span>' +
          '<span class="sc">' + Math.round(r.score) + ' 只</span></div>';
      }).join("");
      const tip = document.getElementById("boardTip");
      if (tip) { tip.textContent = "全站前 8 名 · 所有账号都能看到"; }
    }).catch(function () {});
  }

  // ---------- 跨设备同步：登录同一账号，榜单跟着账号走 ----------
  function syncPull() {
    if (!window.SYNC) { return; }
    window.SYNC.get("whack").then(function (d) {
      if (!d || !Array.isArray(d.board)) { return; }
      const local = loadBoard();
      const seen = {};
      local.forEach(function (r) { if (r && r.ts) { seen[r.ts] = 1; } });
      const merged = local.slice();
      d.board.forEach(function (r) { if (r && r.ts && !seen[r.ts]) { merged.push(r); seen[r.ts] = 1; } });
      merged.sort(function (a, b) { return b.score !== a.score ? b.score - a.score : a.avg - b.avg; });
      const top = merged.slice(0, 10);
      if (!top.length) { return; }
      localStorage.setItem(boardKey(), JSON.stringify(top));
      if (top[0].score > Number(localStorage.getItem("whackBest") || 0)) {
        localStorage.setItem("whackBest", String(top[0].score));
      }
      try { renderBoard(); } catch (e) {}
    }).catch(function () {});
  }
  function syncPush() {
    if (!window.SYNC) { return; }
    window.SYNC.set("whack", { board: loadBoard(), best: best() }).catch(function () {});
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    const p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function renderBoard(highlightTs) {
    const list = loadBoard().slice(0, 5);
    const box = document.getElementById("boardList");
    if (!list.length) { box.innerHTML = '<p class="empty">还没有记录，打一局就上榜</p>'; return; }
    box.innerHTML = list.map(function (r, i) {
      return '<div class="row' + (highlightTs && r.ts === highlightTs ? " me" : "") + '">' +
        '<span class="rk' + (i === 0 ? " g" : "") + '">' + (i + 1) + '</span>' +
        '<span class="sc">' + r.score + ' 只</span>' +
        '<span class="sp">' + (r.avg ? r.avg + 'ms/只' : '--') + '</span>' +
        '<span class="dt">' + fmtDate(r.ts) + '</span></div>';
    }).join("");
  }

  function hud() {
    document.getElementById("score").textContent = score;
    document.getElementById("streak").textContent = streak;
    document.getElementById("left").textContent = Math.ceil(left);
    document.getElementById("best").textContent = best();
  }

  // 立刻清场并放下一个：不等、不延时、不重复同一个洞
  function nextMole() {
    if (!running) { return; }
    for (const h of board.children) { h.classList.remove("mole"); }
    let i = Math.floor(Math.random() * HOLES);
    if (HOLES > 1 && i === moleIdx) { i = (i + 1 + Math.floor(Math.random() * (HOLES - 1))) % HOLES; }
    moleIdx = i;
    board.children[i].classList.add("mole");
  }

  function hitHole(i) {
    if (!running) { return; }
    if (i !== moleIdx) { beep(200, 0.05, "sawtooth"); return; }   // 打偏了不给分，也不算错

    const el = board.children[i];
    score = score + 1;
    streak = streak + 1;
    if (streak > maxStreak) { maxStreak = streak; }
    el.classList.add("hit");
    beep(940, 0.05, "square");
    setTimeout(function () { el.classList.remove("hit"); }, 150);

    hud();
    nextMole();       // 打中后立刻切换，零等待
  }

  function startGame() {
    if (running) { return; }
    running = true;
    score = 0; streak = 0; maxStreak = 0; left = TOTAL_SEC; lastSec = TOTAL_SEC;
    moleIdx = -1;
    document.getElementById("result").style.display = "none";
    document.getElementById("btnStart").style.display = "none";
    document.getElementById("timebar").style.width = "100%";
    renderBoard();
    hud();
    startTs = performance.now();
    nextMole();
    tickId = setInterval(loop, 100);   // 用定时器计时，窗口被遮住也不会停
    loop();
  }

  function loop() {
    if (!running) { return; }
    const elapsed = (performance.now() - startTs) / 1000;
    left = Math.max(0, TOTAL_SEC - elapsed);
    document.getElementById("timebar").style.width = (left / TOTAL_SEC * 100) + "%";
    const sec = Math.ceil(left);
    if (sec !== lastSec) { lastSec = sec; document.getElementById("left").textContent = sec; }
    if (left <= 0) { endGame(); }
  }

  function rankOf(ms) {
    if (ms > 0 && ms <= 200) { return "电竞手速"; }
    if (ms > 0 && ms <= 280) { return "职业级"; }
    if (ms > 0 && ms <= 400) { return "很快"; }
    if (ms > 0 && ms <= 600) { return "一般"; }
    return "慢慢来";
  }

  function endGame() {
    running = false;
    clearInterval(tickId);
    left = 0;
    moleIdx = -1;
    for (const h of board.children) { h.classList.remove("mole"); }
    document.getElementById("timebar").style.width = "0%";
    document.getElementById("left").textContent = "0";
    document.getElementById("btnStart").style.display = "none";   // 结算卡片里已有“再来一局”，底下按钮隐藏，避免重复

    const oldBest = best();
    const avgMs = score > 0 ? Math.round(TOTAL_SEC * 1000 / score) : 0;
    const ts = Date.now();
    const list = saveRecord({ score: score, avg: avgMs, streak: maxStreak, ts: ts });
    const rank = list.findIndex(function (x) { return x.ts === ts; }) + 1;

    document.getElementById("rScore").textContent = score + " 只";
    document.getElementById("rHit").textContent = score;
    document.getElementById("rSpeed").textContent = avgMs + "ms";
    document.getElementById("rStreak").textContent = maxStreak;
    document.getElementById("rRank").textContent = rankOf(avgMs);
    document.getElementById("rBest").textContent = score > oldBest
      ? "🎉 破纪录！上一局最高 " + oldBest + " 只"
      : "历史最高 " + oldBest + " 只，还差 " + (oldBest - score) + " 只";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "center" });
    renderBoard(ts);
    renderGlobal();
    document.getElementById("boardTip").textContent = rank > 0 ? "这局排第 " + rank : "本机前 5 名";
    if (DUEL) {
      try {
        localStorage.setItem("duelResult", JSON.stringify({ id: DUEL.id, role: DUEL.role, game: "whack", score: score, valid: null }));
      } catch (e) {}
      document.getElementById("boardTip").textContent = "PK 成绩已记下，马上回好友页…";
      setTimeout(function () { location.href = "friends.html?duel=" + DUEL.id + "&role=" + DUEL.role; }, 1500);
    }
    hud();
  }

  hud();
  renderBoard();
  syncPull();
  renderGlobal();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
