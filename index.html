<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101521">
<title>杜裕杰的软件柜</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 22px 16px 40px;
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: #101521;
    color: #e9eef7;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .tip { font-size: 13px; color: #8ea0b8; margin: 0 0 20px; line-height: 1.6; }
  a.card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #1b2432;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-decoration: none;
    color: #e9eef7;
    transition: background 0.15s, transform 0.15s;
  }
  a.card:active { background: #253246; transform: scale(0.98); }
  .icon { font-size: 30px; line-height: 1; }
  .name { font-size: 16px; font-weight: 600; }
  .desc { font-size: 12px; color: #8ea0b8; margin-top: 3px; }
  .foot { font-size: 12px; color: #66748a; margin-top: 18px; line-height: 1.8; }
</style>
</head>
<body>

  <h1>杜裕杰的软件柜</h1>
  <p class="tip">电脑和手机连着同一个 Wi-Fi 就能用。点开哪个都能直接操作，数据存在各自的设备上。</p>

  <a class="card" href="jizhangben.html">
    <span class="icon">💰</span>
    <span>
      <span class="name">记账本</span>
      <span class="desc">记一笔、看合计、按时间排</span>
    </span>
  </a>

  <a class="card" href="whack.html">
    <span class="icon">🐭</span>
    <span>
      <span class="name">打地鼠</span>
      <span class="desc">30 秒，看你能敲几个</span>
    </span>
  </a>

  <a class="card" href="reflex.html">
    <span class="icon">⚡</span>
    <span>
      <span class="name">测反射弧</span>
      <span class="desc">8 轮，测你反应多少毫秒</span>
    </span>
  </a>

  <p class="foot">
    想变成手机 App：点浏览器菜单 →「添加到主屏幕」<br>
    iPhone 用 Safari，安卓用 Chrome / Edge。
  </p>

</body>
</html>
