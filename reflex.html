<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="软件柜">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>测反射弧</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #1a2433 0%, #12161f 55%);
    color: #e8eef7; margin: 0; padding: 20px 16px 40px; user-select: none;
  }
  h1 { font-size: 19px; text-align: center; margin: 0 0 4px; font-weight: 600; }
  .sub { text-align: center; font-size: 12px; color: #8ea0b8; margin: 0 0 14px; line-height: 1.8; }

  .tagline { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .tg { font-size: 12px; padding: 6px 12px; border-radius: 20px; background: #1a2433; border: 1px solid #2a3a50; color: #9db0cc; }

  .top {
    max-width: 720px; margin: 0 auto 10px; display: flex;
    justify-content: space-between; font-size: 13px; color: #93a5ba;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .stage {
    height: 42vh; min-height: 250px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.12s, box-shadow 0.12s;
    background: #24303f; box-shadow: inset 0 0 0 1px #33445599;
    touch-action: manipulation;
  }
  .stage .big { font-size: 38px; font-weight: 700; margin-bottom: 8px; }
  .stage .hint { font-size: 14px; color: #9fb0c4; }
  .stage.wait { background: #2b3a4d; }
  .stage.go   { background: #14d07a; color: #06120b; box-shadow: 0 0 46px #14d07a88; }
  .stage.go .hint { color: #0a2a18; }
  .stage.bad  { background: #d9544f; box-shadow: 0 0 46px #d9544f88; }
  .stage.over { background: #1b2431; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .cell { background: #1a2433; border: 1px solid #24314a; border-radius: 12px; padding: 10px; text-align: center; font-size: 12px; color: #93a5ba; }
  .cell b { display: block; font-size: 18px; color: #e8eef7; margin-top: 4px; }

  .verdict {
    background: #1a2433; border: 1px solid #24314a; border-radius: 14px;
    padding: 14px 18px; font-size: 14px; line-height: 1.8; margin-top: 12px;
  }
  .verdict b { color: #14d07a; }

  .chart { margin-top: 14px; background: #1a2433; border: 1px solid #24314a; border-radius: 14px; padding: 12px 14px; }
  .chart .t { font-size: 12px; color: #93a5ba; margin-bottom: 8px; }
  .barrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: #7d90ab; }
  .barrow .n { width: 34px; }
  .barwrap { flex: 1; height: 10px; background: #0f1620; border-radius: 6px; overflow: hidden; }
  .barfill { display: block; height: 100%; background: linear-gradient(90deg, #2b7cff, #14d07a); border-radius: 6px; }
  .barfill.bad { background: #d9544f; }
  .barrow .v { width: 82px; text-align: right; color: #b8c6d6; }

  .board {
    margin-top: 14px; background: #1a2433; border: 1px solid #24314a; border-radius: 14px;
    padding: 12px 14px; text-align: left;
  }
  .board .t { font-size: 12px; color: #9db0cc; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .board .t span { color: #5f6f85; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9db0cc; padding: 5px 0; border-top: 1px dashed #22314a; }
  .row:first-of-type { border-top: none; }
  .row .rk { width: 20px; color: #7d90ab; }
  .row .rk.g { color: #ffd166; font-weight: 700; }
  .row .av { width: 74px; color: #e8eef7; font-weight: 600; }
  .row .fa { width: 70px; }
  .row .dt { margin-left: auto; color: #5f6f85; font-size: 11px; }
  .row.me { background: #2b7cff14; border-radius: 8px; }
  .empty { font-size: 12px; color: #7d90ab; padding: 6px 0; text-align: center; }

  .again {
    display: block; width: 100%; margin-top: 14px; font-size: 16px; padding: 13px;
    border: none; border-radius: 12px; background: #2b7cff; color: #fff; cursor: pointer; font-weight: 600;
  }
  .again:hover { background: #1a66e0; }
  .back {
    position: fixed; right: 14px; bottom: 14px; font-size: 13px; color: #cfe0ff;
    text-decoration: none; background: #2b7cff; padding: 9px 14px; border-radius: 20px;
    box-shadow: 0 6px 18px #2b7cff55;
  }
</style>
<script src="auth.js" data-guard="1"></script>
</head>
<body>

<div class="wrap">
  <h1>测反射弧 · 你的反应有多快</h1>
  <p class="sub">变绿立刻点；提前点是抢跑，这一轮重来<br>一共测 5 次，超过 500 ms 的不计入平均</p>

  <div class="tagline">
    <span class="tg">5 次取平均</span>
    <span class="tg">&gt; 500ms 不算</span>
    <span class="tg">抢跑这轮重来</span>
  </div>

  <div class="top">
    <span id="progress">第 1 / 5 次</span>
    <span id="best">历史最佳：--</span>
  </div>

  <div class="stage" id="stage" onclick="handleClick()">
    <div class="big" id="big">点击开始</div>
    <div class="hint" id="hint">看到变绿就立刻点</div>
  </div>

  <div id="panel"></div>
</div>

<a class="back" href="index.html">← 软件柜</a>

<script>
  const MIN_WAIT = 1200, MAX_WAIT = 4000;
  const ROUNDS = 5;

  // PK 对局：从好友页带 ?duel=<id>&role=c|o 进来，测完把平均存下来再跳回好友页
  function duelInfo() {
    try {
      const q = new URLSearchParams(location.search);
      const id = parseInt(q.get("duel"), 10);
      const role = q.get("role");
      if (!id || (role !== "c" && role !== "o")) { return null; }
      return { id: id, role: role };
    } catch (e) { return null; }
  }
  const DUEL = duelInfo();
  const LIMIT_MS = 500;

  let state = "idle";       // idle / waiting / go / cooldown / done
  let history = [];         // 每轮 {rt, ok}
  let fouls = 0, round = 0, goTime = 0, timerId = null;

  function show(bigText, hintText, cls) {
    document.getElementById("big").textContent = bigText;
    document.getElementById("hint").textContent = hintText;
    document.getElementById("stage").className = "stage " + cls;
  }

  function setProgress() {
    const r = Math.min(round + 1, ROUNDS);
    document.getElementById("progress").textContent = "第 " + r + " / " + ROUNDS + " 次";
  }

  function boardKey() {
    let u = "guest";
    try { const s = AUTH.user(); if (s && s.email) { u = s.email; } } catch (e) {}
    return "rtBoard:" + u;
  }
  function loadBoard() {
    try {
      const arr = JSON.parse(localStorage.getItem(boardKey()) || "[]");
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveRecord(rec) {
    const list = loadBoard();
    list.push(rec);
    list.sort(function (a, b) { return a.avg - b.avg; });
    const top = list.slice(0, 10);
    localStorage.setItem(boardKey(), JSON.stringify(top));
    localStorage.setItem("rtBest", JSON.stringify({ avg: top[0].avg, rounds: ROUNDS }));
    syncPush();
    try {
      if (window.SYNC) { window.SYNC.submitScore("reflex", rec.avg, rec.valid, { fast: rec.fast }); }
    } catch (e) {}
    return top;
  }

  // 全站榜单：所有账号（包括新注册的）都能看到，并显示是谁打的
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderGlobal() {
    if (!window.SYNC) { return; }
    window.SYNC.topScores("reflex", 8, true).then(function (rows) {
      if (!rows || !rows.length) { return; }
      const box = document.getElementById("boardList");
      if (!box) { return; }
      const ids = rows.map(function (r) { return r.user_id; }).filter(Boolean);
      return Promise.all([window.SYNC.profilesByIds(ids), window.SYNC.friendIds(), window.SYNC.profile()]).then(function (res) {
        const prof = res[0] || {};
        const fids = res[1] || {};
        const me = res[2] || {};
        box.innerHTML = rows.map(function (r, i) {
          const p = prof[r.user_id] || {};
          const nm = esc(p.nick || r.name || "玩家");
          const avv = esc(p.avatar || "🙂");
          const mine = !!(me.id && r.user_id === me.id);
          let act;
          if (mine) { act = '<span style="font-size:11px;color:#2b7cff">我</span>'; }
          else if (fids[r.user_id]) { act = '<span style="font-size:11px;color:#8a929e">✓好友</span>'; }
          else { act = '<a class="addf" data-uid="' + esc(r.user_id) + '" style="font-size:11px;color:#2b7cff;cursor:pointer">+加好友</a>'; }
          return '<div class="row' + (mine ? " me" : "") + '">' +
            '<span class="rk' + (i === 0 ? " g" : "") + '">' + (i + 1) + '</span>' +
            '<span style="font-size:15px;line-height:1">' + avv + '</span>' +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + nm + '</span>' +
            act +
            '<span class="av" style="width:74px;text-align:right">平均 ' + Math.round(r.score) + 'ms</span></div>';
        }).join("");
        box.querySelectorAll(".addf").forEach(function (a) {
          a.onclick = function () {
            const uid = a.getAttribute("data-uid");
            a.textContent = "…";
            window.SYNC.addFriend(uid).then(function () {
              a.textContent = "✓已加";
              a.style.color = "#8a929e";
            }).catch(function () { a.textContent = "加失败"; });
          };
        });
        const t = document.querySelector(".board .t span");
        if (t) { t.textContent = "全站前 8 名 · 名字右边可以直接加好友（平均越快越前）"; }
      });
    }).catch(function () {});
  }

  // ---------- 跨设备同步：登录同一账号，榜单跟着账号走 ----------
  function syncPull() {
    if (!window.SYNC) { return; }
    window.SYNC.get("reflex").then(function (d) {
      if (!d || !Array.isArray(d.board)) { return; }
      const local = loadBoard();
      const seen = {};
      local.forEach(function (r) { if (r && r.ts) { seen[r.ts] = 1; } });
      const merged = local.slice();
      d.board.forEach(function (r) { if (r && r.ts && !seen[r.ts]) { merged.push(r); seen[r.ts] = 1; } });
      merged.sort(function (a, b) { return a.avg - b.avg; });
      const top = merged.slice(0, 10);
      if (!top.length) { return; }
      localStorage.setItem(boardKey(), JSON.stringify(top));
      localStorage.setItem("rtBest", JSON.stringify({ avg: top[0].avg, rounds: ROUNDS }));
      try { renderBoard(); showBest(); } catch (e) {}
    }).catch(function () {});
  }
  function syncPush() {
    if (!window.SYNC) { return; }
    window.SYNC.set("reflex", { board: loadBoard(), best: loadBoard()[0] || null }).catch(function () {});
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    const p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function showBest() {
    const list = loadBoard();
    const el = document.getElementById("best");
    el.textContent = list.length ? "历史最佳：平均 " + list[0].avg + " ms（" + list[0].valid + "/5 有效）" : "历史最佳：--";
  }

  function renderBoard(highlightTs) {
    const list = loadBoard().slice(0, 5);
    const box = document.getElementById("boardList");
    if (!list.length) { box.innerHTML = '<p class="empty">还没有记录，测一次就上榜</p>'; return; }
    box.innerHTML = list.map(function (r, i) {
      return '<div class="row' + (highlightTs && r.ts === highlightTs ? " me" : "") + '">' +
        '<span class="rk' + (i === 0 ? " g" : "") + '">' + (i + 1) + '</span>' +
        '<span class="av">平均 ' + r.avg + 'ms</span>' +
        '<span class="fa">最快 ' + r.fast + 'ms</span>' +
        '<span class="dt">' + (r.valid ? r.valid + "/5 有效 · " : "") + fmtDate(r.ts) + '</span></div>';
    }).join("");
  }

  function reset() {
    clearTimeout(timerId);
    state = "idle"; history = []; fouls = 0; round = 0;
    document.getElementById("panel").innerHTML = "";
    setProgress();
    show("点击开始", "看到变绿就立刻点，共 5 次", "wait");
  }

  function start() {
    history = []; fouls = 0; round = 0;
    document.getElementById("panel").innerHTML = "";
    setProgress();
    nextRound();
  }

  function nextRound() {
    state = "waiting";
    show("等…", "别急，等它变绿", "wait");
    setProgress();
    const delay = MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);
    timerId = setTimeout(function () {
      state = "go";
      goTime = performance.now();
      show("点！", "越快越好", "go");
    }, delay);
  }

  function handleClick() {
    if (state === "idle" || state === "done") { start(); return; }
    if (state === "cooldown") { return; }

    if (state === "waiting") {          // 抢跑
      clearTimeout(timerId);
      state = "cooldown";
      fouls = fouls + 1;
      show("抢跑了", "变绿之前点不算，这次重来", "bad");
      setTimeout(nextRound, 1100);
      return;
    }

    if (state === "go") {               // 正常命中
      const rt = Math.max(1, Math.round(performance.now() - goTime));
      const ok = rt <= LIMIT_MS;
      history.push({ rt: rt, ok: ok });
      round = round + 1;
      if (ok) {
        show(rt + " ms", "已记录，下一轮…", "over");
      } else {
        show(rt + " ms", "超过 500 ms，这次不计入平均", "bad");
      }
      state = "cooldown";
      if (round >= ROUNDS) { setTimeout(finish, 900); } else { setTimeout(nextRound, 900); }
    }
  }

  function average(list) {
    let sum = 0;
    for (let i = 0; i < list.length; i++) { sum = sum + list[i]; }
    return Math.round(sum / list.length);
  }

  function grade(avg) {
    if (avg < 170) { return "⚡ 神经反射级，快到不像人类"; }
    if (avg < 210) { return "🔥 很快，有电竞天赋"; }
    if (avg < 260) { return "🙂 不错，比一般人快"; }
    if (avg < 320) { return "😐 普通水平，接近人类平均"; }
    return "🐢 偏慢，休息一下再来";
  }

  function finish() {
    state = "done";
    show("测完了", "点这里再来一局", "over");
    document.getElementById("progress").textContent = ROUNDS + " 次完成";

    const valid = history.filter(function (h) { return h.ok; });
    const over = history.length - valid.length;
    const avg = valid.length ? average(valid.map(function (h) { return h.rt; })) : 0;
    const fast = valid.length ? Math.min.apply(null, valid.map(function (h) { return h.rt; })) : 0;
    const slow = valid.length ? Math.max.apply(null, valid.map(function (h) { return h.rt; })) : 0;

    let bars = "";
    const maxVal = 700;   // 固定刻度：500ms 落在约 71% 处，长短一眼可比
    history.forEach(function (h, i) {
      const w = Math.min(100, Math.max(6, Math.round(h.rt / maxVal * 100)));
      bars += '<div class="barrow"><span class="n">' + (i + 1) + '</span>' +
        '<span class="barwrap"><span class="barfill' + (h.ok ? "" : " bad") + '" style="width:' + w + '%"></span></span>' +
        '<span class="v">' + h.rt + ' ms' + (h.ok ? "" : " 不算") + '</span></div>';
    });

    let ts = 0, rank = 0;
    if (valid.length) {
      ts = Date.now();
      const list = saveRecord({ avg: avg, fast: fast, valid: valid.length, ts: ts });
      rank = list.findIndex(function (x) { return x.ts === ts; }) + 1;
    }

    document.getElementById("panel").innerHTML =
      '<div class="grid">' +
        '<div class="cell">平均<b>' + (valid.length ? avg + ' ms' : '--') + '</b></div>' +
        '<div class="cell">最快<b>' + (valid.length ? fast + ' ms' : '--') + '</b></div>' +
        '<div class="cell">有效<b>' + valid.length + ' / 5</b></div>' +
        '<div class="cell">超 500ms<b>' + over + ' 次</b></div>' +
      '</div>' +
      '<div class="verdict">' +
        (valid.length
          ? '评价：<b>' + grade(avg) + '</b><br>平均只算 500 ms 以内的 ' + valid.length + ' 次；人类平均反应约 250 ms，同一台设备多测几次更准。' +
            (rank > 0 ? '<br>这次在榜上排第 <b>' + rank + '</b> 名。' : '')
          : '这一次 5 次全部超过 500 ms，没有有效成绩（不计入平均、也不上榜）。休息一下再来。') +
      '</div>' +
      '<div class="chart"><div class="t">每一次的成绩（绿=计入平均，红=超过 500ms 不算）</div>' + bars + '</div>' +
      '<div class="board"><div class="t"><b>🏆 反射弧榜</b><span>本机前 5 名（平均越快越前）</span></div>' +
        '<div id="boardList"></div></div>' +
      '<button class="again" onclick="start()">再来一局（5 次）</button>';

    renderBoard(ts);
    showBest();
    renderGlobal();

    if (DUEL) {
      try {
        localStorage.setItem("duelResult", JSON.stringify({
          id: DUEL.id, role: DUEL.role, game: "reflex",
          score: valid.length ? avg : null, valid: valid.length
        }));
      } catch (e) {}
      setTimeout(function () { location.href = "friends.html?duel=" + DUEL.id + "&role=" + DUEL.role; }, 1600);
    }
  }

  reset();
  showBest();
  syncPull();
  renderGlobal();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
