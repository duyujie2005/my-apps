<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="软件柜">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>测反射弧</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #1a2433 0%, #12161f 55%);
    color: #e8eef7; margin: 0; padding: 20px 16px 40px; user-select: none;
  }
  h1 { font-size: 19px; text-align: center; margin: 0 0 4px; font-weight: 600; }
  .sub { text-align: center; font-size: 12px; color: #8ea0b8; margin: 0 0 14px; }

  .rounds { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .rc {
    font-size: 13px; padding: 7px 14px; border-radius: 20px;
    border: 1px solid #2a3a50; background: #1a2433; color: #9db0cc; cursor: pointer;
  }
  .rc.on { background: #2b7cff; border-color: #2b7cff; color: #fff; }
  .rc:disabled { opacity: 0.45; cursor: default; }

  .top {
    max-width: 720px; margin: 0 auto 10px; display: flex;
    justify-content: space-between; font-size: 13px; color: #93a5ba;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .stage {
    height: 42vh; min-height: 250px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.12s, box-shadow 0.12s;
    background: #24303f; box-shadow: inset 0 0 0 1px #33445599;
  }
  .stage .big { font-size: 38px; font-weight: 700; margin-bottom: 8px; }
  .stage .hint { font-size: 14px; color: #9fb0c4; }
  .stage.wait { background: #2b3a4d; }
  .stage.go   { background: #14d07a; color: #06120b; box-shadow: 0 0 46px #14d07a88; }
  .stage.go .hint { color: #0a2a18; }
  .stage.bad  { background: #d9544f; box-shadow: 0 0 46px #d9544f88; }
  .stage.over { background: #1b2431; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .cell { background: #1a2433; border: 1px solid #24314a; border-radius: 12px; padding: 10px; text-align: center; font-size: 12px; color: #93a5ba; }
  .cell b { display: block; font-size: 18px; color: #e8eef7; margin-top: 4px; }

  .verdict {
    background: #1a2433; border: 1px solid #24314a; border-radius: 14px;
    padding: 14px 18px; font-size: 14px; line-height: 1.8; margin-top: 12px;
  }
  .verdict b { color: #14d07a; }

  .chart { margin-top: 14px; background: #1a2433; border: 1px solid #24314a; border-radius: 14px; padding: 12px 14px; }
  .chart .t { font-size: 12px; color: #93a5ba; margin-bottom: 8px; }
  .barrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: #7d90ab; }
  .barrow .n { width: 34px; }
  .barwrap { flex: 1; height: 10px; background: #0f1620; border-radius: 6px; overflow: hidden; }
  .barfill { height: 100%; background: linear-gradient(90deg, #2b7cff, #14d07a); border-radius: 6px; }
  .barrow .v { width: 54px; text-align: right; color: #b8c6d6; }

  .again {
    display: block; width: 100%; margin-top: 14px; font-size: 16px; padding: 13px;
    border: none; border-radius: 12px; background: #2b7cff; color: #fff; cursor: pointer; font-weight: 600;
  }
  .again:hover { background: #1a66e0; }
  .back {
    position: fixed; right: 14px; bottom: 14px; font-size: 13px; color: #cfe0ff;
    text-decoration: none; background: #2b7cff; padding: 9px 14px; border-radius: 20px;
    box-shadow: 0 6px 18px #2b7cff55;
  }
</style>
<script src="auth.js" data-guard="1"></script>
</head>
<body>

<div class="wrap">
  <h1>测反射弧 · 你的反应有多快</h1>
  <p class="sub">变绿立刻点；提前点是抢跑，这一轮重来</p>

  <div class="rounds" id="rounds">
    <button class="rc on" data-n="8" onclick="setRounds(8)">8 轮</button>
    <button class="rc" data-n="12" onclick="setRounds(12)">12 轮</button>
    <button class="rc" data-n="20" onclick="setRounds(20)">20 轮</button>
  </div>

  <div class="top">
    <span id="progress">第 1 / 8 轮</span>
    <span id="best">历史最佳：--</span>
  </div>

  <div class="stage" id="stage" onclick="handleClick()">
    <div class="big" id="big">点击开始</div>
    <div class="hint" id="hint">看到变绿就立刻点</div>
  </div>

  <div id="panel"></div>
</div>

<a class="back" href="index.html">← 软件柜</a>

<script>
  const MIN_WAIT = 1200, MAX_WAIT = 4000;
  let ROUNDS = 8;

  let state = "idle";       // idle / waiting / go / cooldown / done
  let results = [], fouls = 0, round = 0, goTime = 0, timerId = null;

  function show(bigText, hintText, cls) {
    document.getElementById("big").textContent = bigText;
    document.getElementById("hint").textContent = hintText;
    document.getElementById("stage").className = "stage " + cls;
  }

  function setProgress() {
    const r = Math.min(round + 1, ROUNDS);
    document.getElementById("progress").textContent = "第 " + r + " / " + ROUNDS + " 轮";
  }

  function setRounds(n) {
    if (state === "waiting" || state === "go") { return; }
    ROUNDS = n;
    document.querySelectorAll(".rc").forEach(function (b) {
      b.classList.toggle("on", Number(b.dataset.n) === n);
    });
    reset();
  }

  function showBest() {
    const saved = localStorage.getItem("rtBest");
    const el = document.getElementById("best");
    if (!saved) { el.textContent = "历史最佳：--"; return; }
    const b = JSON.parse(saved);
    el.textContent = "历史最佳：平均 " + b.avg + " ms（" + b.rounds + " 轮）";
  }

  function reset() {
    clearTimeout(timerId);
    state = "idle"; results = []; fouls = 0; round = 0;
    document.getElementById("panel").innerHTML = "";
    document.querySelectorAll(".rc").forEach(function (b) { b.disabled = false; });
    setProgress();
    show("点击开始", "看到变绿就立刻点", "wait");
  }

  function start() {
    results = []; fouls = 0; round = 0;
    document.getElementById("panel").innerHTML = "";
    document.querySelectorAll(".rc").forEach(function (b) { b.disabled = true; });
    setProgress();
    nextRound();
  }

  function nextRound() {
    state = "waiting";
    show("等…", "别急，等它变绿", "wait");
    setProgress();
    const delay = MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);
    timerId = setTimeout(function () {
      state = "go";
      goTime = performance.now();
      show("点！", "越快越好", "go");
    }, delay);
  }

  function handleClick() {
    if (state === "idle" || state === "done") { start(); return; }
    if (state === "cooldown") { return; }

    if (state === "waiting") {          // 抢跑
      clearTimeout(timerId);
      state = "cooldown";
      fouls = fouls + 1;
      show("抢跑了", "变绿之前点不算，这轮重来", "bad");
      setTimeout(nextRound, 1100);
      return;
    }

    if (state === "go") {               // 正常命中
      const rt = Math.round(performance.now() - goTime);
      results.push(rt);
      round = round + 1;
      show(rt + " ms", "已记录，下一轮…", "over");
      if (round >= ROUNDS) { finish(); } else { setTimeout(nextRound, 650); }
    }
  }

  function average(list) {
    let sum = 0;
    for (let i = 0; i < list.length; i++) { sum = sum + list[i]; }
    return Math.round(sum / list.length);
  }

  function grade(avg) {
    if (avg < 170) { return "⚡ 神经反射级，快到不像人类"; }
    if (avg < 210) { return "🔥 很快，有电竞天赋"; }
    if (avg < 260) { return "🙂 不错，比一般人快"; }
    if (avg < 320) { return "😐 普通水平，接近人类平均"; }
    return "🐢 偏慢，休息一下再来";
  }

  function finish() {
    state = "done";
    show("测完了", "点这里再来一局", "over");
    document.getElementById("progress").textContent = ROUNDS + " 轮完成";
    document.querySelectorAll(".rc").forEach(function (b) { b.disabled = false; });

    let fast = results[0], slow = results[0];
    for (let i = 1; i < results.length; i++) {
      if (results[i] < fast) { fast = results[i]; }
      if (results[i] > slow) { slow = results[i]; }
    }
    const avg = average(results);
    const maxVal = slow;

    let bars = "";
    results.forEach(function (r, i) {
      const w = Math.max(8, Math.round(r / maxVal * 100));
      bars += '<div class="barrow"><span class="n">' + (i + 1) + '</span>' +
        '<span class="barwrap"><span class="barfill" style="width:' + w + '%"></span></span>' +
        '<span class="v">' + r + ' ms</span></div>';
    });

    document.getElementById("panel").innerHTML =
      '<div class="grid">' +
        '<div class="cell">平均<b>' + avg + ' ms</b></div>' +
        '<div class="cell">最快<b>' + fast + ' ms</b></div>' +
        '<div class="cell">最慢<b>' + slow + ' ms</b></div>' +
        '<div class="cell">抢跑<b>' + fouls + ' 次</b></div>' +
      '</div>' +
      '<div class="verdict">评价：<b>' + grade(avg) + '</b><br>' +
        '人类“看见变化后按一下”的平均反应大约 250 毫秒；同一台设备多测几次更准。' +
      '</div>' +
      '<div class="chart"><div class="t">每一轮的成绩（越短越靠前越好）</div>' + bars + '</div>' +
      '<button class="again" onclick="start()">再来一局（' + ROUNDS + ' 轮）</button>';

    const saved = localStorage.getItem("rtBest");
    if (!saved || avg < JSON.parse(saved).avg) {
      localStorage.setItem("rtBest", JSON.stringify({ avg: avg, hits: results, rounds: ROUNDS }));
    }
    showBest();
  }

  reset();
  showBest();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
