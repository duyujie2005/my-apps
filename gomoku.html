<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>五子棋 · 杜裕杰的软件柜</title>
<script src="auth.js" data-guard="1"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; overflow: hidden;
    padding-top: 42px;
    font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif;
    background: radial-gradient(130% 120% at 50% 0%, #1c2537 0%, #0b0f18 58%, #06090f 100%);
    color: #e9eef7;
  }

  /* 正方形棋盘，铺满除顶部细条外的空间 */
  .board {
    position: relative;
    width: min(calc(100vw - 6px), calc(100dvh - 48px));
    aspect-ratio: 1 / 1;
    padding: 5.5%;
    background: linear-gradient(160deg, #f3ddb0 0%, #e9cd97 48%, #dcb87c 100%);
    border-radius: 10px;
    box-shadow: 0 20px 60px #00000066, inset 0 0 0 1px #ffffff66, inset 0 0 40px #b98b4a33;
  }
  .inner { position: relative; width: 100%; height: 100%; container-type: size; }
  .inner svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .piece {
    position: absolute; width: 6.3%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; cursor: default; z-index: 2;
    transition: box-shadow .12s, transform .08s;
  }
  .piece.b {
    background: radial-gradient(circle at 34% 28%, #6e7380, #20242c 62%, #05070a);
    box-shadow: 0 2px 6px #00000055, inset 0 0 0 1px #ffffff22;
  }
  .piece.w {
    background: radial-gradient(circle at 34% 28%, #ffffff, #e8e4d8 62%, #c6bfae);
    box-shadow: 0 2px 6px #00000040, inset 0 0 0 1px #ffffffaa;
  }
  .piece.last { box-shadow: 0 0 0 2.5px #ff4d3d, 0 3px 9px #00000066; }
  .piece.ghost { opacity: .28; z-index: 1; box-shadow: none; }

  .spot {
    position: absolute; width: 3.4%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: #2b6df6bb; box-shadow: 0 0 0 4px #2b6df633;
    pointer-events: none; z-index: 3;
  }

  .topbar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 30; height: 42px;
    display: flex; align-items: center; gap: 9px; padding: 0 10px;
    background: linear-gradient(#0c1322, #0c1322e6 70%, #0c132200);
  }
  .hbtn {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%; padding: 0;
    background: #ffffff14; border: 1px solid #ffffff24; color: #cfd9ea;
    text-decoration: none; cursor: pointer; font-size: 15px; font-family: inherit;
  }
  .hbtn:active { background: #ffffff2e; }
  .topbar .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #2e9e63; }
  .st {
    flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 600; color: #dfe8f5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .st b { color: #8bbcff; }
  .st.warn { color: #ff8f7a; }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 12px); z-index: 45;
    max-width: 84vw; text-align: center; font-size: 13px; line-height: 1.5;
    background: #0d1522ee; color: #ffd479; border: 1px solid #ffffff1f;
    padding: 9px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .panel {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 35;
    max-width: 560px; margin: 0 auto; padding: 12px 12px 14px;
    background: #0e1421ee; border: 1px solid #26324a; border-radius: 14px;
    box-shadow: 0 18px 50px #00000088; backdrop-filter: blur(10px);
    max-height: 60vh; overflow: auto;
  }
  .modes { display: flex; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .modes button {
    flex: 1 1 40%; padding: 11px 6px; border-radius: 10px; cursor: pointer;
    background: #1a2232; color: #cfd9ea; border: 1px solid #26324a; font-size: 13px;
    font-family: inherit;
  }
  .modes button.on { background: #2b6df6; color: #fff; border-color: #2b6df6; }
  .row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .lv, .btns button {
    padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; font-family: inherit;
    background: #1a2232; color: #cfd9ea; border: 1px solid #26324a;
  }
  .lv.on { background: #2b6df6; border-color: #2b6df6; color: #fff; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btns button.pri { background: #2b6df6; border-color: #2b6df6; color: #fff; }
  .tip { font-size: 12px; color: #8a93a5; line-height: 1.7; }
  .moves {
    max-height: 20vh; overflow: auto; background: #131a28; border: 1px solid #1e2740;
    border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.9;
    color: #aab6c9; margin-top: 8px;
  }
  .moves .b { color: #9fc6ff; }
  .moves .w { color: #ff9086; }
  .moves span.no { color: #59637a; margin-right: 4px; }

  @media (max-height: 520px) { .panel { max-height: 70vh; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="hbtn" href="index.html" title="返回软件柜">‹</a>
  <span class="dot"></span>
  <div class="st" id="status">准备开局</div>
  <button class="hbtn" id="menuBtn" title="菜单">☰</button>
</div>

<div class="board" id="board">
  <div class="inner" id="inner">
    <svg id="grid" viewBox="0 0 14 14" preserveAspectRatio="none"></svg>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="panel" id="panel" style="display:none">
  <div class="modes">
    <button data-mode="ai">我和电脑下</button>
    <button data-mode="self">两个人下一盘</button>
  </div>
  <div class="row" id="lvRow">
    <span class="tip">难度</span>
    <button class="lv" data-lv="1">入门</button>
    <button class="lv" data-lv="2">简单</button>
    <button class="lv" data-lv="3">普通</button>
    <button class="lv" data-lv="4">困难</button>
    <button class="lv" data-lv="5">大师</button>
  </div>
  <div class="row" id="colorRow">
    <span class="tip">我先手</span>
    <button class="lv" data-color="1">我执黑先下</button>
    <button class="lv" data-color="2">电脑先下</button>
  </div>
  <div class="btns">
    <button id="undoBtn">悔一步</button>
    <button id="restartBtn" class="pri">重新开局</button>
  </div>
  <div class="moves" id="moves"></div>
  <div class="tip" style="margin-top:8px">
    点棋盘上的交叉点落子，任意方向连成 5 子就赢。难度越高，电脑越会堵你的活三、也会自己做双三。
  </div>
</div>

<script src="gomoku.js"></script>
<script>
(function () {
  var G = window.GOMOKU;
  var N = G.N;
  var BLACK = 1, WHITE = 2;
  var MARGIN = 0.055;      // 棋盘内边距（和 CSS 的 padding 5.5% 对应）

  var el = {
    board: document.getElementById("board"),
    inner: document.getElementById("inner"),
    grid: document.getElementById("grid"),
    status: document.getElementById("status"),
    panel: document.getElementById("panel"),
    lvRow: document.getElementById("lvRow"),
    colorRow: document.getElementById("colorRow"),
    moves: document.getElementById("moves"),
    undoBtn: document.getElementById("undoBtn"),
    restartBtn: document.getElementById("restartBtn"),
    toast: document.getElementById("toast"),
    menuBtn: document.getElementById("menuBtn")
  };

  var S = {
    mode: "ai",
    level: 3,
    humanColor: BLACK,
    board: G.newBoard(),
    turn: BLACK,
    history: [],
    over: false,
    thinking: false,
    last: null
  };

  /* ---------- 画网格 ---------- */
  function drawGrid() {
    var s = "", i;
    for (i = 0; i < N; i++) {
      s += '<line x1="' + i + '" y1="0" x2="' + i + '" y2="' + (N - 1) + '" />';
      s += '<line x1="0" y1="' + i + '" x2="' + (N - 1) + '" y2="' + i + '" />';
    }
    var stars = [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]];
    for (i = 0; i < stars.length; i++) {
      s += '<circle cx="' + stars[i][0] + '" cy="' + stars[i][1] + '" r="0.42" fill="#6b4a2a" />';
    }
    el.grid.innerHTML = s +
      '<style>line{stroke:#8a6438;stroke-width:.055;stroke-opacity:.85}circle{opacity:.65}</style>';
  }

  function posOf(i) { return (MARGIN + (i / (N - 1)) * (1 - 2 * MARGIN)) * 100; }

  /* ---------- 渲染 ---------- */
  function render() {
    var olds = el.inner.querySelectorAll(".piece, .spot");
    for (var i = 0; i < olds.length; i++) { olds[i].remove(); }

    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var v = S.board[G.idx(x, y)];
        if (!v) { continue; }
        var d = document.createElement("div");
        d.className = "piece " + (v === BLACK ? "b" : "w");
        d.style.left = posOf(x) + "%";
        d.style.top = posOf(y) + "%";
        if (S.last && S.last.x === x && S.last.y === y) { d.className += " last"; }
        el.inner.appendChild(d);
      }
    }
    updateStatus();
    updateMoves();
  }

  function updateStatus() {
    el.status.className = "st";
    if (S.over) { return; }
    if (S.thinking) {
      el.status.textContent = "电脑在想…";
      return;
    }
    if (S.mode === "self") {
      el.status.innerHTML = "轮到<b>" + (S.turn === BLACK ? "黑" : "白") + "</b>下（两人轮流）";
    } else {
      el.status.innerHTML = S.turn === S.humanColor
        ? "轮到你下了（你执<b>" + (S.humanColor === BLACK ? "黑" : "白") + "</b>）"
        : "电脑在走…";
    }
  }

  function updateMoves() {
    var h = S.history;
    if (!h.length) { el.moves.textContent = "还没有落子。"; return; }
    var html = "";
    for (var i = 0; i < h.length; i++) {
      html += "<span class='no'>" + (i + 1) + ".</span>" +
        "<span class='" + (h[i].c === BLACK ? "b" : "w") + "'>" +
        (h[i].c === BLACK ? "●" : "○") + " " + G.toName(h[i].x, h[i].y) + "</span>　";
    }
    el.moves.innerHTML = html;
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.className = "toast show";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.className = "toast"; }, 2000);
  }

  /* ---------- 落子 ---------- */
  function place(x, y, c) {
    S.board[G.idx(x, y)] = c;
    S.history.push({ x: x, y: y, c: c });
    S.last = { x: x, y: y };
    if (G.isWin(S.board, x, y, c)) {
      S.over = true;
      var who = c === BLACK ? "黑" : "白";
      var mine = S.mode === "ai" && c === S.humanColor;
      el.status.className = "st " + (S.mode === "ai" && !mine ? "warn" : "");
      el.status.innerHTML = S.mode === "ai"
        ? (mine ? "🎉 你赢了！" : "😵 电脑赢了，再来一盘？")
        : ("🎉 " + who + "方连成五子，获胜！");
      toast(S.mode === "ai" ? (mine ? "漂亮！你连成五子了" : "电脑连成五子，这盘它赢了") : (who + "方获胜"));
      return;
    }
    if (G.full(S.board)) {
      S.over = true;
      el.status.textContent = "棋盘满了，平局";
      return;
    }
    S.turn = G.other(c);
    render();
    maybeAI();
  }

  function maybeAI() {
    if (S.mode !== "ai" || S.over || S.turn !== G.other(S.humanColor)) { return; }
    S.thinking = true;
    updateStatus();
    var snapshot = S.board;
    setTimeout(function () {
      var mv = G.best(snapshot, S.turn, S.level);
      S.thinking = false;
      if (!mv) { toast("没地方下了"); return; }
      place(mv.x, mv.y, S.turn);
    }, 120);
  }

  /* ---------- 点击换算 ---------- */
  function hitPoint(clientX, clientY) {
    var r = el.inner.getBoundingClientRect();
    if (!r.width) { return null; }
    var px = (clientX - r.left) / r.width;
    var py = (clientY - r.top) / r.height;
    var gx = ((px - MARGIN) / (1 - 2 * MARGIN)) * (N - 1);
    var gy = ((py - MARGIN) / (1 - 2 * MARGIN)) * (N - 1);
    var x = Math.round(gx), y = Math.round(gy);
    if (x < 0 || x > N - 1 || y < 0 || y > N - 1) { return null; }
    /* 太偏也算没点中 */
    if (Math.abs(gx - x) > 0.55 || Math.abs(gy - y) > 0.55) { return null; }
    return { x: x, y: y };
  }

  el.board.addEventListener("pointerdown", function (e) {
    if (S.over) { toast("这盘已经结束了，点「重新开局」再来"); return; }
    if (S.thinking) { return; }
    if (S.mode === "ai" && S.turn !== S.humanColor) { return; }
    var p = hitPoint(e.clientX, e.clientY);
    if (!p) { return; }
    if (S.board[G.idx(p.x, p.y)] !== 0) { toast("这里已经有子了"); return; }
    place(p.x, p.y, S.turn);
  });

  /* ---------- 控件 ---------- */
  function reset() {
    S.board = G.newBoard();
    S.turn = BLACK;
    S.history = [];
    S.over = false;
    S.thinking = false;
    S.last = null;
    el.status.className = "st";
    render();
    if (S.mode === "ai" && S.humanColor !== BLACK) { maybeAI(); }
  }

  function setMode(m) {
    S.mode = m;
    document.querySelectorAll(".modes button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-mode") === m);
    });
    el.lvRow.style.display = m === "ai" ? "" : "none";
    el.colorRow.style.display = m === "ai" ? "" : "none";
    reset();
  }

  el.menuBtn.addEventListener("click", function () {
    var vis = el.panel.style.display !== "none";
    el.panel.style.display = vis ? "none" : "";
  });

  document.querySelectorAll(".modes button").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.getAttribute("data-mode")); });
  });

  el.lvRow.querySelectorAll(".lv").forEach(function (b) {
    b.addEventListener("click", function () {
      S.level = +b.getAttribute("data-lv");
      el.lvRow.querySelectorAll(".lv").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      toast("难度改为「" + G.LEVELS[S.level].name + "」");
    });
  });

  el.colorRow.querySelectorAll(".lv").forEach(function (b) {
    b.addEventListener("click", function () {
      S.humanColor = +b.getAttribute("data-color");
      el.colorRow.querySelectorAll(".lv").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      reset();
    });
  });

  el.undoBtn.addEventListener("click", function () {
    if (S.thinking) { toast("电脑还在想，稍等"); return; }
    if (!S.history.length) { toast("还没下呢"); return; }

    function popOne() {
      var m = S.history.pop();
      if (m) { S.board[G.idx(m.x, m.y)] = 0; }
    }
    function syncTurn() {
      S.turn = (S.history.length % 2 === 0) ? BLACK : WHITE;
      var lastM = S.history[S.history.length - 1];
      S.last = lastM ? { x: lastM.x, y: lastM.y } : null;
    }

    if (S.mode === "self") {
      popOne();
    } else {
      /* 人机：一直退到「轮到你走」为止 */
      popOne();
      syncTurn();
      while (S.history.length && S.turn !== S.humanColor) { popOne(); syncTurn(); }
    }
    S.over = false;
    syncTurn();
    el.status.className = "st";
    render();
  });

  el.restartBtn.addEventListener("click", function () { reset(); });

  /* ---------- 启动 ---------- */
  drawGrid();
  el.lvRow.querySelector('.lv[data-lv="3"]').classList.add("on");
  el.colorRow.querySelector('.lv[data-color="1"]').classList.add("on");
  setMode("ai");
  el.panel.style.display = "none";
})();
</script>
</body>
</html>
