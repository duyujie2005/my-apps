name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build apk
        run: |
          set -e
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/34.0.0"
          PLAT="$SDK/platforms/android-34/android.jar"
          if [ ! -f "$BT/aapt2" ] || [ ! -f "$PLAT" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            echo "installing sdk parts"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          mkdir -p build/classes build/dex build/pack
          javac -source 8 -target 8 -Xlint:-options -classpath "$PLAT" -d build/classes android/MainActivity.java
          "$BT/d8" --lib "$PLAT" --min-api 21 --output build/dex $(find build/classes -name '*.class')
          cp build/dex/classes.dex build/pack/classes.dex
          "$BT/aapt2" link -o build/base.apk -I "$PLAT" --manifest android/AndroidManifest.xml --min-sdk-version 21 --target-sdk-version 34 --version-code 1 --version-name 1.0
          ( cd build/pack && zip -q ../base.apk classes.dex )
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
          keytool -genkeypair -keystore build/key.jks -alias app -keyalg RSA -keysize 2048 -validity 10000 -storepass duobaoshelf -keypass duobaoshelf -dname "CN=Du Yujie, O=Shelf, C=CN" > /dev/null 2>&1
          "$BT/apksigner" sign --ks build/key.jks --ks-pass pass:duobaoshelf --key-pass pass:duobaoshelf --out build/app.apk build/aligned.apk
          "$BT/apksigner" verify --print-certs build/app.apk | head -3
          ls -l build/app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest --repo $GITHUB_REPOSITORY > /dev/null 2>&1 || gh release create apk-latest --repo $GITHUB_REPOSITORY --title "手机安装包" --notes "安卓安装包（脚本自动构建）"
          gh release upload apk-latest build/app.apk --repo $GITHUB_REPOSITORY --clobber
