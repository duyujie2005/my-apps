<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大世界 · 杜裕杰的软件柜</title>
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0b1220; --card: #131c2b; --card2: #0f1620; --line: #22303f;
    --text: #e8eef7; --dim: #93a4bb; --blue: #2b7cff; --red: #d9544f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #16233a, var(--bg));
    color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 16px 14px 96px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .back, .chip {
    display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 12px;
    background: #17202f; color: #cddae8; text-decoration: none; border: 1px solid var(--line);
  }
  h1 { font-size: 24px; margin: 14px 0 6px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 14px; line-height: 1.6; }
  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #182537; border: 1px solid #24344a; border-radius: 12px; padding: 8px 10px;
    font-size: 12px; color: var(--dim); margin-bottom: 12px;
  }
  .bar .bchip { background: #22304a; border-radius: 999px; padding: 3px 9px; color: #cddae8; cursor: pointer; }
  .msg {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .msg .avw { flex: none; width: 40px; height: 40px; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #1b2637; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .hd { display: flex; align-items: baseline; gap: 8px; }
  .msg .hd b { font-size: 13px; }
  .msg .hd .tm { font-size: 11px; color: var(--dim); margin-left: auto; }
  .msg .tx { font-size: 14px; line-height: 1.6; margin-top: 3px; word-break: break-word; white-space: pre-wrap; }
  .msg .ops { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; }
  .msg .ops a { color: #8fa4bf; text-decoration: none; cursor: pointer; }
  .msg .ops a:hover { color: #cddae8; }
  .empty { color: var(--dim); font-size: 13px; padding: 24px 0; text-align: center; }
  .say {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: #0e1725; border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .say .in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 11px 12px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--blue); }
  button {
    background: #1e2b3d; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--blue); border-color: var(--blue); font-weight: 600; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: #1b2a3d; border: 1px solid #2c4159; color: #dbe7f4;
    padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 60; max-width: 90vw; text-align: center;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← 软件柜</a>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="chip" href="friends.html">👥 好友</a>
      <span class="chip" id="who">未登录</span>
    </div>
  </div>

  <h1>🌍 大世界</h1>
  <p class="sub">这里是所有人的公共留言墙：你发的每一句，所有登录这个软件柜的人都能看到。不想看某个人，点他那条下面的「屏蔽他」。</p>

  <div class="bar" id="bar">正在加载…</div>
  <div id="list"></div>
</div>

<div class="say">
  <div class="in">
    <input id="txt" maxlength="300" placeholder="跟大世界里的人说点什么…">
    <button class="primary" id="btnSend">发送</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script>
(function () {
  var me = null, myProfile = null, msgs = [], prof = {}, blocked = {}, timer = 0, busy = false;

  function toast(t) {
    var el = document.getElementById("toast");
    el.textContent = t;
    el.classList.add("on");
    setTimeout(function () { el.classList.remove("on"); }, 2200);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function timeText(iso) {
    var d = new Date(iso), now = new Date();
    var hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    if (d.toDateString() === now.toDateString()) { return hm; }
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }

  function av(a, px) {
    return window.AV ? window.AV(a, px) : esc(a || "🙂");
  }

  function render() {
    var list = document.getElementById("list");
    var mineOf = (myProfile && myProfile.id) || "";
    var shown = 0;
    list.innerHTML = msgs.map(function (m) {
      if (blocked[m.user_id]) { return ""; }
      shown++;
      var p = prof[m.user_id] || {};
      var name = p.nick || "玩家";
      var isMine = m.user_id === mineOf;
      return '<div class="msg">' +
        '<span class="avw">' + av(p.avatar, 40) + '</span>' +
        '<div class="body">' +
          '<div class="hd"><b>' + esc(name) + (isMine ? ' <span style="color:#2b7cff;font-size:11px">我</span>' : "") + '</b>' +
          '<span class="tm">' + timeText(m.created_at) + '</span></div>' +
          '<div class="tx">' + esc(m.body) + '</div>' +
          '<div class="ops">' +
            (isMine ? '<a data-del="' + m.id + '">删除</a>' : '') +
            (isMine ? '' : '<a data-block="' + esc(m.user_id) + '" data-name="' + esc(name) + '">屏蔽他</a>') +
          '</div>' +
        '</div></div>';
    }).join("");
    if (!shown) {
      list.innerHTML = '<div class="empty">还没有人说话，你来当第一个吧～</div>';
    }
    list.querySelectorAll("[data-block]").forEach(function (a) {
      a.onclick = function () {
        var uid = a.getAttribute("data-block");
        var nm = a.getAttribute("data-name");
        window.SYNC.blockUser(uid).then(function () {
          blocked[uid] = 1;
          renderBar(); render();
          toast("已屏蔽 " + nm + "，以后你看不到他/她的消息了");
        }).catch(function (e) { toast("屏蔽失败：" + ((e && e.message) || "网络问题")); });
      };
    });
    list.querySelectorAll("[data-del]").forEach(function (a) {
      a.onclick = function () {
        var id = a.getAttribute("data-del");
        window.SYNC.worldDelete(id).then(function () { return load(); }).catch(function () { toast("删除失败"); });
      };
    });
  }

  function renderBar() {
    var ids = Object.keys(blocked);
    var bar = document.getElementById("bar");
    if (!ids.length) {
      bar.innerHTML = "所有人都能看到你发的消息 · 共 " + msgs.length + " 条";
      return;
    }
    bar.innerHTML = '已屏蔽 ' + ids.length + ' 人：' + ids.map(function (id) {
      var p = prof[id] || {};
      return '<span class="bchip" data-unblock="' + esc(id) + '">' + esc(p.nick || "某人") + ' ✕</span>';
    }).join(" ") + '<span style="margin-left:auto">点名字可解除</span>';
    bar.querySelectorAll("[data-unblock]").forEach(function (c) {
      c.onclick = function () {
        var uid = c.getAttribute("data-unblock");
        window.SYNC.unblockUser(uid).then(function () {
          delete blocked[uid];
          renderBar(); render();
          toast("已解除屏蔽");
        }).catch(function () { toast("解除失败"); });
      };
    });
  }

  function load(full) {
    var tasks = [window.SYNC.worldList(80)];
    if (full === false) {
      tasks.push(Promise.resolve(myProfile), Promise.resolve(blocked));   // 轮询时不重复取，省时间
    } else {
      tasks.push(window.SYNC.profile(true), window.SYNC.blockedIds());
    }
    return Promise.all(tasks).then(function (res) {
      msgs = res[0] || [];
      if (full !== false) {
        myProfile = res[1] || {};
        blocked = res[2] || {};
      }
      var mine = msgs.map(function (m) { return m.user_id; });
      if (myProfile && myProfile.id) { mine.push(myProfile.id); }
      var uniq = mine.filter(function (v, i) { return v && mine.indexOf(v) === i; });
      var need = uniq.filter(function (id) { return !prof[id]; });          // 只查没见过的人
      if (!need.length) {
        renderBar();
        render();
        return true;
      }
      return window.SYNC.profilesByIds(need).then(function (m) {
        for (var k in (m || {})) { if (Object.prototype.hasOwnProperty.call(m, k)) { prof[k] = m[k]; } }
        renderBar();
        render();
      });
    });
  }

  function send() {
    var input = document.getElementById("txt");
    var body = (input.value || "").trim();
    if (!body) { return; }
    if (!me) { toast("要登录后才能在 大世界 发言"); return; }
    var b = document.getElementById("btnSend");
    b.disabled = true;
    window.SYNC.worldSend(body.slice(0, 300)).then(function () {
      input.value = "";
      b.disabled = false;
      return load();
    }).catch(function (e) {
      b.disabled = false;
      toast("发不出去：" + ((e && e.message) || "网络问题"));
    });
  }

  function boot() {
    window.SYNC.online().then(function (ok) {
      if (!ok) { location.replace("login.html?next=world.html"); return; }
      me = true;
      window.SYNC.profile(true).then(function (p) {
        if (!p) { return; }
        myProfile = p;
        document.getElementById("who").innerHTML = av(p.avatar, 16) + " " + esc(p.nick || "");
      }).catch(function () {});
      load().catch(function (e) { toast("加载失败：" + e.message); });
      clearInterval(timer);
      timer = setInterval(function () {
        if (busy || document.hidden) { return; }
        busy = true;
        load(false).catch(function () {}).then(function () { busy = false; });
      }, 4000);
    });
  }

  document.getElementById("btnSend").onclick = send;
  document.getElementById("txt").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  });
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }

  if (window.SYNC) { boot(); } else { window.addEventListener("load", boot); }
})();
</script>
</body>
</html>
